function tmParseLine(line,sep){let a=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&line[i+1]==='"'&&q){v+='"';i++}else if(c==='"')q=!q;else if(c===sep&&!q){a.push(v);v=''}else v+=c}a.push(v);return a}

// ===== TeamMate ADMIN V5.3: Evidence Editor =====
function canEditEntriesV53(){return admin?.active!==false && (admin?.role==='admin'||admin?.role==='time_editor'||admin?.is_global_admin===true)}
function entryTypeOptionsV53(selected){return (data.types||[]).filter(x=>x.active!==false).map(x=>`<option value="${x.id}" ${String(x.id)===String(selected)?'selected':''}>${esc(x.name)}</option>`).join('')}
function entryLocationOptionsV53(selected){return (data.locations||[]).filter(x=>x.active!==false).map(x=>`<option value="${x.id}" ${String(x.id)===String(selected)?'selected':''}>${esc(x.name)}</option>`).join('')}
function entryUserOptionsV53(selected){return (data.profiles||[]).filter(x=>x.active!==false&&!x.is_emergency).map(x=>`<option value="${x.id}" ${String(x.id)===String(selected)?'selected':''}>${esc(profileName(x.id))}</option>`).join('')}
function reasonV53(id){let v=$(id)?.value.trim();if(!v)throw Error('Razlog spremembe je obvezen.');return v}
window.editEntry=id=>{if(!canEditEntriesV53())return alert('Ta vloga nima pravice urejati evidence časa.');let e=data.entries.find(x=>String(x.id)===String(id));if(!e)return;openDrawer('Uredi registracijo',`<div class="formgrid"><div class="field"><label>Datum</label><input id="edDate" type="date" value="${teDateV52(e)}"></div><div class="field"><label>Čas</label><input id="edTime" type="time" value="${String(e.entry_time||'').slice(0,5)}"></div><div class="field"><label>Vrsta dogodka</label><select id="edType">${entryTypeOptionsV53(e.registration_type_id)}</select></div><div class="field"><label>Poslovalnica</label><select id="edLoc">${entryLocationOptionsV53(e.location_id)}</select></div><div class="field full"><label>Razlog spremembe *</label><textarea id="edReason" placeholder="Zakaj se zapis spreminja?"></textarea></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="saveEntry" class="btn">Shrani popravek</button><button id="deleteEntryV53" class="btn danger">Izbriši registracijo</button></div><div id="edMsg"></div>`);$('saveEntry').onclick=async()=>{try{let reason=reasonV53('edReason');await api('/rest/v1/time_entries?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({entry_date:$('edDate').value,entry_time:$('edTime').value,registration_type_id:$('edType').value||null,location_id:$('edLoc').value||null,edited_by:admin.id,edited_at:new Date().toISOString(),edit_reason:reason})});await loadAll();$('drawer').classList.add('hidden');entries()}catch(x){$('edMsg').className='msg error';$('edMsg').textContent=x.message}};$('deleteEntryV53').onclick=async()=>{try{let reason=reasonV53('edReason');if(!confirm('Res želiš izbrisati to registracijo? Zapis bo označen kot izbrisan in ostane v revizijski sledi.'))return;await api('/rest/v1/time_entries?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({deleted:true,edited_by:admin.id,edited_at:new Date().toISOString(),edit_reason:reason})});await loadAll();$('drawer').classList.add('hidden');entries()}catch(x){$('edMsg').className='msg error';$('edMsg').textContent=x.message}}}
window.addEntryV53=()=>{if(!canEditEntriesV53())return alert('Ta vloga nima pravice dodajati registracij.');let today=new Date().toISOString().slice(0,10),now=new Date().toTimeString().slice(0,5);openDrawer('Nova registracija',`<div class="formgrid"><div class="field full"><label>Zaposleni</label><select id="neUser">${entryUserOptionsV53('')}</select></div><div class="field"><label>Datum</label><input id="neDate" type="date" value="${today}"></div><div class="field"><label>Čas</label><input id="neTime" type="time" value="${now}"></div><div class="field"><label>Vrsta dogodka</label><select id="neType">${entryTypeOptionsV53('')}</select></div><div class="field"><label>Poslovalnica</label><select id="neLoc">${entryLocationOptionsV53('')}</select></div><div class="field full"><label>Razlog ročnega vnosa *</label><textarea id="neReason" placeholder="Zakaj se registracija vnaša ročno?"></textarea></div></div><button id="createEntryV53" class="btn">Dodaj registracijo</button><div id="neMsg"></div>`);$('createEntryV53').onclick=async()=>{try{let reason=reasonV53('neReason');if(!$('neUser').value||!$('neDate').value||!$('neTime').value||!$('neType').value)throw Error('Zaposleni, datum, čas in vrsta dogodka so obvezni.');let body={user_id:$('neUser').value,entry_date:$('neDate').value,entry_time:$('neTime').value,registration_type_id:$('neType').value,location_id:$('neLoc').value||null,edited_by:admin.id,edited_at:new Date().toISOString(),edit_reason:reason};await api('/rest/v1/time_entries',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});await loadAll();$('drawer').classList.add('hidden');entries()}catch(x){$('neMsg').className='msg error';$('neMsg').textContent=x.message}}}
const entriesV53Base=entries;
entries=function(){entriesV53Base();let h=$('view')?.querySelector('.head');if(h){let actions=h.lastElementChild;if(actions&&canEditEntriesV53()){let b=document.createElement('button');b.className='btn';b.textContent='＋ Dodaj registracijo';b.onclick=addEntryV53;actions.insertAdjacentElement('beforebegin',b)}}let badge=$('view')?.querySelector('h1 .badge');if(badge)badge.textContent='V5.3'}

</script></body></html>
