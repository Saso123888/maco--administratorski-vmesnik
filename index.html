}

function teCodeV52(e){let t=(data.types||[]).find(x=>String(x.id)===String(e.registration_type_id));return String(t?.code||e.entry_type||e.type||'').toUpperCase()}

function teMinutesV52(e){let v=String(e.entry_time||'').slice(0,5),p=v.split(':').map(Number);return p.length===2&&Number.isFinite(p[0])?p[0]*60+p[1]:null}

function signedMmV52(n){n=Math.round(Number(n)||0);return (n>0?'+':n<0?'-':'')+mmV52(Math.abs(n))}

function calcNorm523(start,end){let a=timeToMinutes522(start),b=timeToMinutes522(end);if(!start||!end)return 0;if(b<a)b+=1440;return Math.max(0,b-a)}
function normalizeShift523(s,i){let start=String(s.start||s.start_time||'06:00').slice(0,5),end=String(s.end||s.end_time||'14:00').slice(0,5);return{name:s.name||s.shift_name||('Izmena '+(i+1)),start,end,norm:Number(s.norm||0)||calcNorm523(start,end)}}
function shiftEditorRow523(s,i,prefix){return `<div class="v523-shift-row" data-index="${i}"><div class="v523-line1"><div class="field"><label>Izmena</label><input data-k="name" value="${esc(s.name||('Izmena '+(i+1)))}"></div><div class="field v523-norm"><label>Norma</label><input data-k="normview" value="${minutesToTime522(s.norm)}" readonly></div><button type="button" class="btn danger small" data-del="${i}">Izbriši</button></div><div class="v523-line2"><div class="field"><label>Od</label><input data-k="start" type="time" value="${s.start}"></div><div class="field"><label>Do</label><input data-k="end" type="time" value="${s.end}"></div></div></div>`}
