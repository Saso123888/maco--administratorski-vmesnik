#173c3010}.card{padding:17px}.card small{color:var(--muted)}.card b{display:block;font-size:28px;margin-top:6px;color:var(--pd)}.panel{padding:16px;margin-bottom:17px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr) auto auto;gap:9px;align-items:end}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:850;color:#486159}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cadad3;border-radius:9px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:11px;border-bottom:1px solid #e6eeea;text-align:left;font-size:13px;vertical-align:top}th{background:#f6f9f7;color:#51675f;position:sticky;top:0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:850}.pill.on{background:#ddf4e8;color:#147d4c}.pill.off{background:#ffe6e4;color:#b93b3b}.yes{color:#099b5a;font-size:18px;font-weight:950}.no{color:#e24c4c;font-size:18px;font-weight:950}.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(180deg,rgba(0,121,68,.91),rgba(0,73,44,.94)),linear-gradient(135deg,#0d8a56,#043d2a)}.loginbox{width:min(450px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 28px 75px #00271988}.loginbox .brand{color:var(--p);text-align:center;margin-bottom:28px}.loginbox .btn{width:100%;margin-top:15px;padding:14px}.msg{margin-top:11px;font-size:13px;font-weight:750;white-space:pre-line}.error{color:#b72f2f}.success{color:#087a48}.drawer,.backdrop{position:fixed;z-index:60}.backdrop{inset:0;background:#001c1455}.drawer{top:0;right:0;bottom:0;width:min(480px,100%);background:#fff;padding:22px;overflow:auto;box-shadow:-20px 0 60px #001f1740}.drawer-head{display:flex;justify-content:space-between;gap:12px;padding-bottom:13px;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0}.close{border:0;background:none;font-size:29px;cursor:pointer} <section id="loginPage" class="login"><form id="loginForm" class="loginbox"><div class="brand">MACO<small>d.o.o. IDRIJA</small></div><h2>Administratorska prijava</h2><div class="field"><label>Uporabniško ime</label><input id="loginUser" value="admin" autocomplete="username"></div><div class="field" style="margin-top:11px"><label>Geslo</label><input id="loginPass" type="password" value="admin1234" autocomplete="current-password"></div><button class="btn">Prijava</button><div id="loginMsg" class="msg"></div></form></section>

<div id="backdrop" class="backdrop hidden"></div><aside id="drawer" class="drawer hidden"><div class="drawer-head"><div><h2 id="drawerTitle">Nov uporabnik</h2><p style="margin:4px 0;color:var(--muted)">Dodaj zaposlenega v sistem.</p></div><button id="closeDrawer" class="close">×</button></div><form id="userForm"><input id="editId" type="hidden"><div class="section">Osebni podatki</div><div class="formgrid"><div class="field"><label>Ime *</label><input id="firstName" required></div><div class="field"><label>Priimek *</label><input id="lastName" required></div><div class="field full"><label>Delovno mesto *</label><input id="jobTitle" required placeholder="npr. Prodajalec"></div></div><div class="section">Prijavni podatki</div><div class="field"><label>Uporabniško ime *</label><input id="username" required minlength="3"></div><div id="passwordFields" class="formgrid" style="margin-top:10px"><div class="field"><label>Geslo *</label><input id="password" type="password" minlength="5"></div><div class="field"><label>Ponovi geslo *</label><input id="password2" type="password" minlength="5"></div></div><small id="passwordHint">Najmanj 5 znakov. Geslo določi administrator.</small><div class="section">Veljavnost računa</div><div class="formgrid"><div class="field"><label>Velja od *</label><input id="validFrom" type="date" required></div><div class="field"><label>Velja do *</label><input id="validTo" type="date" required></div><label class="check full"><input id="isActive" type="checkbox" checked> Aktiven uporabnik</label></div><div class="section">Pravice in dostop</div><label class="check"><input id="canTime" type="checkbox" checked> Registracija časa</label><label class="check" style="margin-top:8px"><input id="canAdmin" type="checkbox"> Administracija</label><div class="section">Lokacija in časovna pravila</div><div class="formgrid"><div class="field full"><label>Lokacija prijave</label><select id="userLocation"><option value="">Samodejno / brez omejitve</option></select></div><label class="check full"><input id="enforceLocation" type="checkbox"> Upoštevaj GPS lokacijo prijave</label><div class="field"><label>Dovoljeni radij (m)</label><input id="allowedRadius" type="number" min="10" max="10000" step="10" value="200"></div><label class="check"><input id="useTimeRule" type="checkbox"> Dodatna časovna opcija</label></div><div class="field" style="margin-top:12px"><label>Opombe</label><textarea id="notes" rows="3"></textarea></div><div id="userMsg" class="msg"></div><div class="drawer-actions"><button type="button" id="cancelUser" class="btn secondary">Prekliči</button><button id="saveUserBtn" class="btn">Ustvari uporabnika</button></div></form></aside>
<script>
(()=>{'use strict';const BASE='https://gjtenghgidthqmhehxjx.supabase.co';const KEY='sb_publishable_msTthlKSK_D8GwxCzh5AEA_FkBak2pM';let token='',refreshToken='',admin=null,profiles=[],entries=[],companySettings=null,locations=[],registrationTypes=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function headers(){return{'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'}}async function request(path,opt={}){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),18000);try{const res=await fetch(BASE+path,{...opt,headers:{...headers(),...(opt.headers||{})},signal:ctrl.signal});const text=await res.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={message:text}}if(!res.ok)throw Error(data.error||data.msg||data.message||data.error_description||('HTTP '+res.status));return data}finally{clearTimeout(timer)}}async function login(e){e.preventDefault();try{$('loginMsg').className='msg';$('loginMsg').textContent='Prijavljam ...';let u=$('loginUser').value.trim(),auth=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:u.includes('@')?u:u+'@maco.si',password:$('loginPass').value})});token=auth.access_token;refreshToken=auth.refresh_token||'';localStorage.setItem('maco_admin_session',JSON.stringify({access_token:token,refresh_token:refreshToken,user_id:auth.user.id}));admin=(await request('/rest/v1/profiles?id=eq.'+auth.user.id+'&select=*'))[0];if(!admin||admin.can_administration!==true)throw Error('Uporabnik nima pravice za administracijo.');$('loginPage').classList.add('hidden');$('adminPage').classList.remove('hidden');$('adminLabel').textContent=admin.first_name+' '+admin.last_name;await loadAll();showPage('dashboard')}catch(err){$('loginMsg').className='msg error';$('loginMsg').textContent='Napaka: '+err.message}}async function loadAll(){[profiles,entries,locations,registrationTypes]=await Promise.all([request('/rest/v1/profiles?select=*&order=last_name.asc'),request('/rest/v1/time_entries?select=*&order=entry_date.desc,entry_time.desc'),request('/rest/v1/locations?select=*&order=name.asc'),request('/rest/v1/registration_types?select=*&order=sort_order.asc')]);let cs=await request('/rest/v1/company_settings?select=*&limit=1');companySettings=cs[0]||null;applyBranding()}function showPage(name){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));$('shell').classList.remove('open');({dashboard,entries:entriesPage,users:usersPage,reports,audit,settings:settingsPage}[name]||dashboard)()}function dashboard(){let today=new Date().toLocaleDateString('en-CA'),tod=entries.filter(x=>!x.deleted&&x.entry_date===today);$('view').innerHTML=`<div class="head"><div><h1>Nadzorna plošča</h1><p>Današnji pregled evidence.</p></div></div><div class="cards"><div class="card"><small>Današnji prihodi</small><b>${tod.filter(x=>x.entry_type==='PRIHOD').length}</b></div><div class="card"><small>Današnji odhodi</small><b>${tod.filter(x=>x.entry_type==='ODHOD').length}</b></div><div class="card"><small>Aktivni uporabniki</small><b>${profiles.filter(x=>x.active).length}</b></div><div class="card"><small>Administratorji</small><b>${profiles.filter(x=>x.can_administration).length}</b></div></div><div class="panel"><h3>Hitra dejanja</h3><div class="actions"><button id="quickNew" class="btn">＋ Nov uporabnik</button><button class="btn secondary" onclick="window.print()">Natisni pregled</button></div></div>`;$('quickNew').onclick=()=>openUser()}function profileName(id){let p=profiles.find(x=>x.id===id);return p?p.first_name+' '+p.last_name:id}function entriesPage(){let now=new Date(),month=new Date(now.getFullYear(),now.getMonth(),1);$('view').innerHTML=`<div class="head"><div><h1>Evidenca časa</h1><p>Pregled, filtriranje in urejanje prihodov, odhodov ter odsotnosti.</p></div><button class="btn amber" onclick="window.print()">Natisni</button></div><div class="panel"><div class="filters"><div class="field"><label>Datum od</label><input id="eFrom" type="date" value="${month.toLocaleDateString('en-CA')}"></div><div class="field"><label>Datum do</label><input id="eTo" type="date" value="${now.toLocaleDateString('en-CA')}"></div><div class="field"><label>Uporabnik</label><select id="eUser"><option value="">Vsi uporabniki</option>${profiles.map(p=>`<option value="${p.id}">${esc(p.first_name+' '+p.last_name)}</option>`).join('')}</select></div><div class="field"><label>Vrsta</label><select id="eType"><option value="">Vse vrste</option><option>PRIHOD</option><option>ODHOD</option><option>DOPUST</option><option>BOLNISKA</option><option>NADURNO_DELO</option><option>SLUZBENA_POT</option><option>DRUGO</option></select></div><button id="entryFilter" class="btn">Filtriraj</button><button id="entryClear" class="btn secondary">Počisti</button></div></div><div class="cards" id="entryStats"></div><div class="panel tablewrap"><table><thead><tr><th>ID</th><th>Datum</th><th>Čas</th><th>Vrsta</th><th>Uporabnik</th><th>Lokacija</th><th>GPS</th><th>Google Maps</th></tr></thead><tbody id="entryRows"></tbody></table></div>`;$('entryFilter').onclick=renderEntries;$('entryClear').onclick=()=>{$('eFrom').value='';$('eTo').value='';$('eUser').value='';$('eType').value='';renderEntries()};renderEntries()}function renderEntries(){let a=entries.filter(x=>!x.deleted),f=$('eFrom').value,t=$('eTo').value,u=$('eUser').value,ty=$('eType').value;if(f)a=a.filter(x=>x.entry_date>=f);if(t)a=a.filter(x=>x.entry_date<=t);if(u)a=a.filter(x=>x.user_id===u);if(ty)a=a.filter(x=>x.entry_type===ty);$('entryStats').innerHTML=`<div class="card"><small>Prikazani zapisi</small><b>${a.length}</b></div><div class="card"><small>Prihodi</small><b>${a.filter(x=>x.entry_type==='PRIHOD').length}</b></div><div class="card"><small>Odhodi</small><b>${a.filter(x=>x.entry_type==='ODHOD').length}</b></div><div class="card"><small>Odsotnosti</small><b>${a.filter(x=>['DOPUST','BOLNISKA'].includes(x.entry_type)).length}</b></div>`;$('entryRows').innerHTML=a.map(x=>`<tr><td>${esc(x.entry_number)}</td><td>${x.entry_date}</td><td>${x.entry_time||''}</td><td><span class="pill on">${x.entry_type}</span></td><td>${esc(profileName(x.user_id))}</td><td>${esc(x.qr_location_name||'')}</td><td>${x.gps_latitude?Number(x.gps_latitude).toFixed(5)+', '+Number(x.gps_longitude).toFixed(5):'-'}</td><td>${x.gps_latitude&&x.gps_longitude?'<a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps?q='+x.gps_latitude+','+x.gps_longitude+'">Odpri zemljevid</a>':'-'}</td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:28px">Ni zapisov za izbrane filtre.</td></tr>'}function usersPage(){$('view').innerHTML=`<div class="head"><div><h1>Uporabniki</h1><p>Upravljanje zaposlenih in administratorskih računov.</p></div><button id="newUser" class="btn">＋ Nov uporabnik</button></div><div class="cards"><div class="card"><small>Vsi uporabniki</small><b>${profiles.length}</b></div><div class="card"><small>Aktivni</small><b>${profiles.filter(x=>x.active).length}</b></div><div class="card"><small>Registracija časa</small><b>${profiles.filter(x=>x.can_time_registration).length}</b></div><div class="card"><small>Administratorji</small><b>${profiles.filter(x=>x.can_administration).length}</b></div></div><div class="panel"><div class="filters"><div class="field"><label>Iskanje</label><input id="findUser" placeholder="Ime, username ali delovno mesto"></div><div class="field"><label>Status</label><select id="statusFilter"><option value="">Vsi</option><option value="on">Aktivni</option><option value="off">Neaktivni</option></select></div><div class="field"><label>Dostop</label><select id="accessFilter"><option value="">Vsi</option><option value="time">Registracija časa</option><option value="admin">Administracija</option></select></div><div></div><button id="filterUsers" class="btn">Išči</button><button id="clearUsers" class="btn secondary">Počisti</button></div></div><div class="panel tablewrap"><table><thead><tr><th>Uporabniško ime</th><th>Ime in priimek</th><th>Delovno mesto</th><th>Registracija</th><th>Admin</th><th>Velja od</th><th>Velja do</th><th>Status</th><th>Dejanja</th></tr></thead><tbody id="userRows"></tbody></table></div>`;$('newUser').onclick=()=>openUser();$('filterUsers').onclick=renderUsers;$('clearUsers').onclick=()=>{$('findUser').value='';$('statusFilter').value='';$('accessFilter').value='';renderUsers()};renderUsers()}function renderUsers(){let q=($('findUser')?.value||'').toLowerCase(),st=$('statusFilter')?.value,ac=$('accessFilter')?.value,rows=profiles.filter(p=>!q||[p.username,p.first_name,p.last_name,p.job_title].join(' ').toLowerCase().includes(q)).filter(p=>!st||(st==='on'?p.active:!p.active)).filter(p=>!ac||(ac==='time'?p.can_time_registration:p.can_administration));$('userRows').innerHTML=rows.map(p=>`<tr><td><b>${esc(p.username)}</b></td><td>${esc(p.first_name+' '+p.last_name)}</td><td>${esc(p.job_title)}</td><td class="${p.can_time_registration?'yes':'no'}">${p.can_time_registration?'✓':'×'}</td><td class="${p.can_administration?'yes':'no'}">${p.can_administration?'✓':'×'}</td><td>${p.valid_from||'-'}</td><td>${p.valid_to||'-'}</td><td><span class="pill ${p.active?'on':'off'}">${p.active?'Aktiven':'Neaktiven'}</span></td><td><button class="btn secondary" onclick="window.editUser('${p.id}')">Uredi</button></td></tr>`).join('')}function openUser(id){let p=profiles.find(x=>x.id===id)||{};$('userForm').reset();$('editId').value=id||'';$('drawerTitle').textContent=id?'Uredi uporabnika':'Nov uporabnik';$('saveUserBtn').textContent=id?'Shrani spremembe':'Ustvari uporabnika';$('firstName').value=p.first_name||'';$('lastName').value=p.last_name||'';$('jobTitle').value=p.job_title||'';$('username').value=p.username||'';$('username').disabled=!!id;$('validFrom').value=p.valid_from||new Date().toLocaleDateString('en-CA');let y=new Date();y.setFullYear(y.getFullYear()+1);$('validTo').value=p.valid_to||y.toLocaleDateString('en-CA');$('isActive').checked=p.active!==false;$('canTime').checked=p.can_time_registration!==false;$('canAdmin').checked=!!p.can_administration;$('userLocation').innerHTML='<option value="">Samodejno / brez omejitve</option>'+locations.filter(x=>x.active!==false).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('userLocation').value=p.location_id||'';$('enforceLocation').checked=!!p.enforce_location;$('allowedRadius').value=p.allowed_radius_m||companySettings?.default_radius_m||200;$('useTimeRule').checked=!!p.use_time_rule;$('notes').value=p.notes||'';$('passwordFields').classList.toggle('hidden',!!id);$('passwordHint').classList.toggle('hidden',!!id);$('password').required=!id;$('password2').required=!id;$('userMsg').textContent='';$('backdrop').classList.remove('hidden');$('drawer').classList.remove('hidden')}window.editUser=id=>openUser(id);function closeUser(){$('drawer').classList.add('hidden');$('backdrop').classList.add('hidden')}async function saveUser(e){e.preventDefault();let id=$('editId').value,p1=$('password').value,p2=$('password2').value;if(!id&&p1!==p2){$('userMsg').className='msg error';$('userMsg').textContent='Gesli se ne ujemata.';return}if(!id&&p1.length<5){$('userMsg').className='msg error';$('userMsg').textContent='Geslo mora imeti najmanj 5 znakov.';return}let body={username:$('username').value.trim().toLowerCase(),password:p1,first_name:$('firstName').value.trim(),last_name:$('lastName').value.trim(),job_title:$('jobTitle').value.trim(),valid_from:$('validFrom').value,valid_to:$('validTo').value,active:$('isActive').checked,can_time_registration:$('canTime').checked,can_administration:$('canAdmin').checked,notes:$('notes').value.trim(),location_id:$('userLocation').value||null,enforce_location:$('enforceLocation').checked,allowed_radius_m:Number($('allowedRadius').value)||200,use_time_rule:$('useTimeRule').checked};try{$('saveUserBtn').disabled=true;$('userMsg').className='msg';$('userMsg').textContent='Shranjujem ...';if(id){let update={first_name:body.first_name,last_name:body.last_name,job_title:body.job_title,valid_from:body.valid_from,valid_to:body.valid_to,active:body.active,can_time_registration:body.can_time_registration,can_administration:body.can_administration,role:body.can_administration?'admin':'user',notes:body.notes,location_id:body.location_id,enforce_location:body.enforce_location,allowed_radius_m:body.allowed_radius_m,use_time_rule:body.use_time_rule,updated_by:admin.id,updated_at:new Date().toISOString()};await request('/rest/v1/profiles?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(update)})}else{await request('/functions/v1/admin-users',{method:'POST',body:JSON.stringify(body)})}await loadAll();$('userMsg').className='msg success';$('userMsg').textContent=id?'Spremembe so shranjene.':'Uporabnik je uspešno ustvarjen.';setTimeout(()=>{closeUser();usersPage()},700)}catch(err){$('userMsg').className='msg error';$('userMsg').textContent='Napaka: '+err.message}finally{$('saveUserBtn').disabled=false}}function applyBranding(){let name=companySettings?.company_name||'MACO';document.querySelectorAll('.brand').forEach(el=>{let small=el.querySelector('small');el.childNodes[0].nodeValue=name+' ';if(companySettings?.logo_url){let img=el.querySelector('img.company-logo');if(!img){img=document.createElement('img');img.className='company-logo';img.alt='Logotip podjetja';el.prepend(img)}img.src=companySettings.logo_url}})}
function settingsPage(){let c=companySettings||{};$('view').innerHTML=`<div class="head"><div><h1>Nastavitve</h1><p>Podjetje, logotip, poslovalnice, GPS, delovni čas, vrste registracije in teme.</p></div><button id="saveSettings" class="btn">Shrani nastavitve</button></div><div id="settingsMsg" class="msg"></div><div class="settings-grid"><div class="panel"><h3>Podjetje</h3><div class="formgrid"><div class="field full"><label>Naziv podjetja</label><input id="sCompany" value="${esc(c.company_name||'MACO')}"></div><div class="field full"><label>Naslov podjetja</label><input id="sAddress" value="${esc(c.company_address||'')}"></div><div class="field"><label>Privzeti GPS radij (m)</label><input id="sRadius" type="number" value="${c.default_radius_m||200}"></div><div class="field"><label>Število poslovalnic</label><input value="${locations.filter(x=>x.active!==false).length}" disabled></div><div class="field full"><label>Logotip podjetja</label><div class="logo-preview" id="logoPreview">${c.logo_url?'<img src="'+esc(c.logo_url)+'" alt="Logotip podjetja">':'Logotip še ni dodan'}</div><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"><p class="hint">PNG, JPG ali WebP, največ 2 MB.</p></div></div></div><div class="panel"><h3>Privzeti delovni čas</h3><div class="formgrid"><div class="field"><label>Začetek</label><input id="sShiftStart" type="time" value="${String(c.default_shift_start||'06:00').slice(0,5)}"></div><div class="field"><label>Konec</label><input id="sShiftEnd" type="time" value="${String(c.default_shift_end||'14:00').slice(0,5)}"></div><div class="field"><label>Prihod prej (min)</label><input id="sEarly" type="number" value="${c.default_checkin_early_min??30}"></div><div class="field"><label>Odhod pozneje (min)</label><input id="sLate" type="number" value="${c.default_checkout_late_min??60}"></div></div><p class="hint">06:00–14:00 + 30/60 min pomeni dovoljeno okno 05:30–15:00.</p></div><div class="panel wide"><div class="subhead"><h3>Poslovalnice</h3><button id="addLocation" class="btn secondary">＋ Poslovalnica</button></div><div id="locationRows"></div></div><div class="panel wide"><div class="subhead"><h3>Vrste registracije</h3><button id="addType" class="btn secondary">＋ Nova vrsta</button></div><div id="typeRows"></div></div><div class="panel"><h3>Tema registracije časa</h3><select id="registrationTheme"><option value="green">MACO zelena</option><option value="blue">Modra</option><option value="dark">Temna</option><option value="light">Svetla</option></select></div><div class="panel"><h3>Tema admin dela</h3><select id="adminTheme"><option value="green">MACO zelena</option><option value="blue">Modra</option><option value="dark">Temna</option><option value="light">Svetla</option></select></div></div>`;$('registrationTheme').value=c.registration_theme||'green';$('adminTheme').value=c.admin_theme||'green';renderLocationRows();renderTypeRows();$('addLocation').onclick=()=>{locations.push({id:'new-'+Date.now(),name:'Nova poslovalnica',address:'',latitude:'',longitude:'',active:true});renderLocationRows()};$('addType').onclick=()=>{registrationTypes.push({id:'new-'+Date.now(),code:'NOVA_'+Date.now(),name:'Nova vrsta',enforce_location:true,remote_mode:false,active:true,sort_order:100});renderTypeRows()};$('logoFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>2097152){alert('Logotip je večji od 2 MB.');e.target.value='';return}let u=URL.createObjectURL(f);$('logoPreview').innerHTML='<img src="'+u+'" alt="Predogled logotipa">'};$('saveSettings').onclick=saveSettings}
function renderLocationRows(){$('locationRows').innerHTML=locations.map((l,i)=>`<div class="location-row" data-li="${i}"><div class="field"><label>Ime</label><input data-k="name" value="${esc(l.name||'')}"></div><div class="field"><label>Naslov</label><input data-k="address" value="${esc(l.address||'')}"></div><div class="field"><label>GPS širina</label><input data-k="latitude" value="${l.latitude??''}"></div><div class="field"><label>GPS dolžina</label><input data-k="longitude" value="${l.longitude??''}"></div><button class="btn secondary" type="button" data-ltoggle="${i}">${l.active===false?'Aktiviraj':'Deaktiviraj'}</button></div>`).join('')||'<div class="notice">Ni poslovalnic. Dodaj prvo poslovalnico.</div>';document.querySelectorAll('[data-ltoggle]').forEach(b=>b.onclick=()=>{locations[+b.dataset.ltoggle].active=locations[+b.dataset.ltoggle].active===false;renderLocationRows()})}
function renderTypeRows(){$('typeRows').innerHTML=registrationTypes.map((t,i)=>`<div class="type-row" data-ti="${i}"><div class="field"><label>Naziv</label><input data-k="name" value="${esc(t.name||'')}"></div><div class="field"><label>Koda</label><input data-k="code" value="${esc(t.code||'')}"></div><label class="check"><input data-k="enforce_location" type="checkbox" ${t.enforce_location?'checked':''}> GPS omejitev</label><label class="check"><input data-k="remote_mode" type="checkbox" ${t.remote_mode?'checked':''}> Delo od doma</label><button class="btn secondary" type="button" data-ttoggle="${i}">${t.active===false?'Aktiviraj':'Deaktiviraj'}</button></div>`).join('');document.querySelectorAll('[data-ttoggle]').forEach(b=>b.onclick=()=>{registrationTypes[+b.dataset.ttoggle].active=registrationTypes[+b.dataset.ttoggle].active===false;renderTypeRows()})}
async function uploadLogo(){let f=$('logoFile')?.files?.[0];if(!f)return companySettings?.logo_url||null;let name='company-logo-'+Date.now()+'.'+(f.name.split('.').pop()||'png');let res=await fetch(BASE+'/storage/v1/object/company-assets/'+encodeURIComponent(name),{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':f.type,'x-upsert':'true'},body:f});if(!res.ok)throw Error(await res.text());return BASE+'/storage/v1/object/public/company-assets/'+encodeURIComponent(name)}
async function saveSettings(){let msg=$('settingsMsg');try{msg.className='msg';msg.textContent='Shranjujem ...';document.querySelectorAll('[data-li]').forEach(row=>{let l=locations[+row.dataset.li];row.querySelectorAll('[data-k]').forEach(x=>l[x.dataset.k]=x.value)});document.querySelectorAll('[data-ti]').forEach(row=>{let t=registrationTypes[+row.dataset.ti];row.querySelectorAll('[data-k]').forEach(x=>t[x.dataset.k]=x.type==='checkbox'?x.checked:x.value)});let logo=await uploadLogo(),cs={company_name:$('sCompany').value.trim(),company_address:$('sAddress').value.trim(),logo_url:logo,default_radius_m:+$('sRadius').value||200,default_shift_start:$('sShiftStart').value,default_shift_end:$('sShiftEnd').value,default_checkin_early_min:+$('sEarly').value||0,default_checkout_late_min:+$('sLate').value||0,registration_theme:$('registrationTheme').value,admin_theme:$('adminTheme').value,updated_at:new Date().toISOString()};await request('/rest/v1/company_settings?id=eq.'+companySettings.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(cs)});for(let l of locations){let body={name:l.name,address:l.address||null,latitude:l.latitude||null,longitude:l.longitude||null,active:l.active!==false,updated_at:new Date().toISOString()};if(String(l.id).startsWith('new-'))await request('/rest/v1/locations',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});else await request('/rest/v1/locations?id=eq.'+l.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)})}for(let t of registrationTypes){let body={code:t.code,name:t.name,enforce_location:!!t.enforce_location,remote_mode:!!t.remote_mode,active:t.active!==false,sort_order:+t.sort_order||100,updated_at:new Date().toISOString()};if(String(t.id).startsWith('new-'))await request('/rest/v1/registration_types',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});else await request('/rest/v1/registration_types?id=eq.'+t.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)})}await loadAll();msg.className='msg success';msg.textContent='Nastavitve so shranjene.';settingsPage()}catch(e){msg.className='msg error';msg.textContent='Napaka: '+e.message}}
function reports(){$('view').innerHTML=`<div class="head"><div><h1>Poročila</h1><p>Priprava in tisk evidence.</p></div><button class="btn amber" onclick="window.print()">Natisni</button></div><div class="panel">Poročila ostajajo povezana z evidenco prihodov, odhodov in odsotnosti.</div>`}async function audit(){let items=await request('/rest/v1/audit_log?select=*&order=changed_at.desc&limit=200');$('view').innerHTML=`<div class="head"><div><h1>Sledljivost</h1><p>Kdo, kaj in kdaj je spremenil.</p></div></div><div class="panel">${items.map(x=>`<div class="audit"><b>${new Date(x.changed_at).toLocaleString('sl-SI')}</b> · ${esc(x.action)} · ${esc(x.table_name)} · ${esc(x.record_id)}</div>`).join('')}</div>`}
async function restoreSession(){let raw=localStorage.getItem('maco_admin_session');if(!raw)return;try{let saved=JSON.parse(raw),auth;if(saved.refresh_token){auth=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:saved.refresh_token})});token=auth.access_token;refreshToken=auth.refresh_token||saved.refresh_token;localStorage.setItem('maco_admin_session',JSON.stringify({access_token:token,refresh_token:refreshToken,user_id:auth.user.id}));}else{token=saved.access_token;}let uid=(auth&&auth.user&&auth.user.id)||saved.user_id;admin=(await request('/rest/v1/profiles?id=eq.'+uid+'&select=*'))[0];if(!admin||admin.can_administration!==true)throw Error('Ni administratorskih pravic.');$('loginPage').classList.add('hidden');$('adminPage').classList.remove('hidden');$('adminLabel').textContent=admin.first_name+' '+admin.last_name;await loadAll();showPage('dashboard')}catch(e){localStorage.removeItem('maco_admin_session');token='';refreshToken='';}}$('loginForm').onsubmit=login;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('logoutBtn').onclick=()=>{localStorage.removeItem('maco_admin_session');location.reload()};$('menuBtn').onclick=()=>$('shell').classList.toggle('open');$('closeDrawer').onclick=closeUser;$('cancelUser').onclick=closeUser;$('backdrop').onclick=closeUser;$('userForm').onsubmit=saveUser;restoreSession();})();
</script></body></html>
