<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MACO Registracija časa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#0877bd;--d:#15384b;--g:#159b63;--r:#db4a4a;--bg:#edf5f8}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:linear-gradient(145deg,#e9f4f8,#fff);color:var(--d)}main{max-width:470px;margin:auto;min-height:100vh;padding:24px}.logo{text-align:center;color:var(--b);font-size:48px;font-weight:900;letter-spacing:-3px;margin:25px 0 4px}.sub{text-align:center;color:#67808d;margin-bottom:25px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 14px 40px #18394b22}input,button{width:100%;padding:15px;border-radius:13px;border:1px solid #cbdce5;font-size:16px;margin:7px 0}button{border:0;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.green{background:var(--g)}.red{background:var(--r)}.ghost{background:#eaf4fa;color:var(--b)}.hidden{display:none}.info{padding:12px;border-radius:12px;background:#eef7fb;margin:12px 0;font-size:14px}.msg{margin-top:12px;font-weight:700}</style></head><body><main><div class="logo">MACO</div><div class="sub">Evidenca delovnega časa</div><section id="login" class="card"><h2>Prijava</h2><input id="username" value="demo" placeholder="Uporabniško ime"><input id="password" type="password" value="demo1234" placeholder="Geslo"><label><input id="remember" type="checkbox" checked style="width:auto"> Zapomni si me</label><button onclick="signIn()">Prijava</button><div id="loginMsg" class="msg"></div></section><section id="work" class="card hidden"><h2 id="hello">Registracija</h2><div id="place" class="info">Delovno mesto še ni potrjeno.</div><button onclick="skipScan()">Preskoči QR skeniranje (demo)</button><div id="actions" class="row hidden"><button class="green" onclick="stamp('PRIHOD')">PRIHOD</button><button class="red" onclick="stamp('ODHOD')">ODHOD</button></div><div id="result" class="info hidden"></div><button class="ghost" onclick="signOut()">Odjava</button></section></main><script>
const URL='https://gjtenghgidthqmhehxjx.supabase.co';const KEY='sb_publishable_msTthlKSK_D8GwxCzh5AEA_FkBak2pM';
const sb=supabase.createClient(URL,KEY);let me=null,locationRow=null;function emailFor(u){return u.includes('@')?u:u+'@maco.si'}async function signIn(){loginMsg.textContent='Prijavljam ...';const {data,error}=await sb.auth.signInWithPassword({email:emailFor(username.value.trim()),password:password.value});if(error){loginMsg.textContent=error.message;return}const {data:p,error:pe}=await sb.from('profiles').select('*').eq('id',data.user.id).single();if(pe){loginMsg.textContent=pe.message;return}me=p;login.classList.add('hidden');work.classList.remove('hidden');hello.textContent='Pozdravljeni, '+(p.first_name||p.username);loginMsg.textContent=''}async function skipScan(){const {data,error}=await sb.from('work_locations').select('*').eq('qr_code','maco.do benzinski servis').single();if(error){alert(error.message);return}locationRow=data;place.innerHTML='Delovno mesto: <b>'+data.name+'</b><br><small>QR preskočen za demo</small>';actions.classList.remove('hidden')}async function getGps(){return new Promise(ok=>{if(!navigator.geolocation)return ok({});navigator.geolocation.getCurrentPosition(p=>ok({gps_latitude:p.coords.latitude,gps_longitude:p.coords.longitude,gps_accuracy:p.coords.accuracy}),()=>ok({}),{enableHighAccuracy:true,timeout:7000})})}async function stamp(type){if(!locationRow)return;const gps=await getGps();const n=new Date();const payload={user_id:me.id,entry_date:n.toLocaleDateString('en-CA'),entry_time:n.toTimeString().slice(0,8),entry_type:type,work_location_id:locationRow.id,qr_location_name:locationRow.name,source:'mobile',created_by:me.id,...gps};const {data,error}=await sb.from('time_entries').insert(payload).select('entry_number').single();if(error){alert(error.message);return}result.classList.remove('hidden');result.innerHTML='<b>'+type+'</b> uspešno shranjen.<br>'+n.toLocaleString('sl-SI')+'<br>ID: '+data.entry_number}async function signOut(){await sb.auth.signOut();location.reload()}(async()=>{const {data}=await sb.auth.getSession();if(data.session){const {data:p}=await sb.from('profiles').select('*').eq('id',data.session.user.id).single();if(p){me=p;login.classList.add('hidden');work.classList.remove('hidden');hello.textContent='Pozdravljeni, '+(p.first_name||p.username)}}})();
</script></body></html>
