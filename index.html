<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MACO Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#0877bd;--d:#173b50;--bg:#f1f6f8;--r:#d74747}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:var(--bg);color:#213d4d}header{background:var(--d);color:white;padding:18px 4%;font-size:25px;font-weight:900}.brand{color:#61c6ff}.wrap{max-width:1200px;margin:auto;padding:18px}.panel{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 24px #0001}button,input,select{padding:10px 12px;border-radius:9px;border:1px solid #cedbe1;margin:4px}button{background:var(--b);color:#fff;border:0;font-weight:700}.danger{background:var(--r)}.hidden{display:none}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px;border-bottom:1px solid #e4ecef;text-align:left;font-size:13px}nav{display:flex;flex-wrap:wrap;gap:4px}.login{max-width:430px;margin:50px auto}.login input{width:100%;margin:7px 0}.login button{width:100%}.filters{display:flex;flex-wrap:wrap;gap:4px}.gps{font-size:12px}</style></head><body><header><span class="brand">MACO</span> ADMIN</header><main class="wrap"><section id="alogin" class="panel login"><h2>Administratorska prijava</h2><input id="au" value="admin" placeholder="Uporabniško ime"><input id="ap" value="admin1234" type="password" placeholder="Geslo"><button onclick="loginAdmin()">Prijava</button><div id="am"></div></section><section id="adminApp" class="hidden"><nav><button onclick="loadEntries()">Evidenca</button><button onclick="loadUsers()">Uporabniki</button><button onclick="loadAudit()">Sledljivost</button><button onclick="addEntry()">+ Zapis</button><button onclick="print()">Natisni</button><button onclick="logout()">Odjava</button></nav><div id="view" class="panel"></div></section></main><script>
const URL='https://gjtenghgidthqmhehxjx.supabase.co';const KEY='sb_publishable_msTthlKSK_D8GwxCzh5AEA_FkBak2pM';const sb=supabase.createClient(URL,KEY);let admin=null;function mail(u){return u.includes('@')?u:u+'@maco.si'}async function loginAdmin(){const {data,error}=await sb.auth.signInWithPassword({email:mail(au.value.trim()),password:ap.value});if(error){am.textContent=error.message;return}const {data:p,error:pe}=await sb.from('profiles').select('*').eq('id',data.user.id).single();if(pe||p.role!=='admin'){am.textContent='Uporabnik nima administratorskih pravic.';await sb.auth.signOut();return}admin=p;alogin.classList.add('hidden');adminApp.classList.remove('hidden');loadEntries()}async function loadEntries(){const {data,error}=await sb.from('time_entries').select('*,profiles!time_entries_user_id_fkey(username,first_name,last_name),work_locations(name)').eq('deleted',false).order('entry_date',{ascending:false}).order('entry_time',{ascending:false});if(error){view.textContent=error.message;return}view.innerHTML='<h2>Evidenca časa</h2><div class="filters"><input id="fFrom" type="date"><input id="fTo" type="date"><select id="fType"><option value="">Vse vrste</option><option>PRIHOD</option><option>ODHOD</option><option>DOPUST</option><option>BOLNISKA</option><option>NADURNO_DELO</option></select><button onclick="filterRows()">Filtriraj</button></div><div class="table"><table id="et"><thead><tr><th>ID</th><th>Uporabnik</th><th>Datum</th><th>Čas</th><th>Vrsta</th><th>QR mesto</th><th>GPS samo admin</th><th></th></tr></thead><tbody>'+data.map(x=>`<tr data-date="${x.entry_date}" data-type="${x.entry_type}"><td>${x.entry_number}</td><td>${x.profiles?x.profiles.first_name+' '+x.profiles.last_name:''}</td><td>${x.entry_date}</td><td>${x.entry_time||''}</td><td>${x.entry_type}</td><td>${x.qr_location_name||''}</td><td class="gps">${x.gps_latitude||''} ${x.gps_longitude||''}</td><td><button onclick="editEntry('${x.id}','${x.entry_type}')">Uredi</button><button class="danger" onclick="delEntry('${x.id}')">Izbriši</button></td></tr>`).join('')+'</tbody></table></div>'}function filterRows(){document.querySelectorAll('#et tbody tr').forEach(r=>{let ok=(!fFrom.value||r.dataset.date>=fFrom.value)&&(!fTo.value||r.dataset.date<=fTo.value)&&(!fType.value||r.dataset.type===fType.value);r.style.display=ok?'':'none'})}async function editEntry(id,old){let t=prompt('Nova vrsta zapisa:',old);if(!t)return;let note=prompt('Razlog spremembe:','Admin popravek')||'';const {error}=await sb.from('time_entries').update({entry_type:t,note,updated_at:new Date().toISOString(),updated_by:admin.id}).eq('id',id);if(error)alert(error.message);else loadEntries()}async function delEntry(id){let reason=prompt('Razlog brisanja:','Admin brisanje');if(reason===null)return;const {error}=await sb.from('time_entries').update({deleted:true,deleted_at:new Date().toISOString(),deleted_by:admin.id,deletion_reason:reason}).eq('id',id);if(error)alert(error.message);else loadEntries()}async function loadUsers(){const {data,error}=await sb.from('profiles').select('*').order('last_name');if(error){view.textContent=error.message;return}view.innerHTML='<h2>Uporabniki</h2><p>Za dodajanje prijavnih uporabnikov v tej demo verziji uporabi Supabase Authentication. Tu so profili in vloge.</p><div class="table"><table><tr><th>Username</th><th>Ime</th><th>Delovno mesto</th><th>Vloga</th><th>Aktiven</th></tr>'+data.map(x=>`<tr><td>${x.username}</td><td>${x.first_name} ${x.last_name}</td><td>${x.job_title}</td><td>${x.role}</td><td>${x.active?'Da':'Ne'}</td></tr>`).join('')+'</table></div>'}async function loadAudit(){const {data,error}=await sb.from('audit_log').select('*').order('changed_at',{ascending:false}).limit(200);if(error){view.textContent=error.message;return}view.innerHTML='<h2>Zgodovina sprememb</h2>'+data.map(x=>`<p><b>${new Date(x.changed_at).toLocaleString('sl-SI')}</b> · ${x.action} · ${x.table_name} · ${x.record_id}</p>`).join('')}async function addEntry(){const {data:us}=await sb.from('profiles').select('id,username,first_name,last_name').eq('active',true);let q=us.map((u,i)=>`${i+1}: ${u.first_name} ${u.last_name} (${u.username})`).join('\n');let n=parseInt(prompt('Izberi uporabnika:\n'+q))-1;if(!us[n])return;let type=prompt('PRIHOD / ODHOD / DOPUST / BOLNISKA / NADURNO_DELO','DOPUST');if(!type)return;let date=prompt('Datum YYYY-MM-DD',new Date().toLocaleDateString('en-CA'));if(!date)return;let time=['DOPUST','BOLNISKA'].includes(type)?null:prompt('Čas HH:MM','08:00');const {error}=await sb.from('time_entries').insert({user_id:us[n].id,entry_date:date,entry_time:time,entry_type:type,source:'admin',created_by:admin.id,note:'Ročni administratorski vnos'});if(error)alert(error.message);else loadEntries()}async function logout(){await sb.auth.signOut();location.reload()}(async()=>{const {data}=await sb.auth.getSession();if(data.session){const {data:p}=await sb.from('profiles').select('*').eq('id',data.session.user.id).single();if(p?.role==='admin'){admin=p;alogin.classList.add('hidden');adminApp.classList.remove('hidden');loadEntries()}}})();
</script></body></html>
