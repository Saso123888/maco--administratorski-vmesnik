<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MACO Admin</title><style>:root{--b:#1488c9;--n:#173f54;--bg:#eef5f8;--r:#cf2e23}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17384a}header{background:var(--n);color:#fff;padding:26px 5%;font-size:28px;font-weight:900}header span{color:#57c3ff}.wrap{max-width:1180px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 35px #17384a1c}.login{max-width:540px;margin:55px auto}label{display:block;font-weight:700;margin:15px 0 6px}input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #cadbe3;font-size:16px}button{background:var(--b);color:white;border:0;font-weight:800;cursor:pointer;margin-top:16px}.hidden{display:none}.msg{margin-top:14px;white-space:pre-line}.err{color:var(--r)}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.nav button{width:auto;margin:0}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:10px;border-bottom:1px solid #e2eaee;text-align:left;font-size:13px}</style></head><body><header><span>MACO</span> ADMIN</header><main class="wrap"><section id="loginCard" class="card login"><h1>Administratorska prijava</h1><form id="form"><label>Uporabniško ime</label><input id="user" value="admin"><label>Geslo</label><input id="pass" type="password" value="admin1234"><button id="btn">Prijava</button></form><div id="msg" class="msg"></div></section><section id="app" class="hidden"><div class="nav"><button id="entries">Evidenca</button><button id="users">Uporabniki</button><button id="audit">Sledljivost</button><button id="logout">Odjava</button></div><div id="content" class="card"></div></section></main><script>
(()=>{'use strict';
const BASE='https://gjtenghgidthqmhehxjx.supabase.co';
const APIKEY='sb_publishable_msTthlKSK_D8GwxCzh5AEA_FkBak2pM';
let token='',profile=null;
const $=id=>document.getElementById(id), msg=$('msg');
function headers(json=true){let h={'apikey':APIKEY};if(token)h.Authorization='Bearer '+token;if(json)h['Content-Type']='application/json';return h}
async function req(path,opt={}){const c=new AbortController();const t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(BASE+path,{...opt,headers:{...headers(),...(opt.headers||{})},signal:c.signal});const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{d={message:text}}if(!r.ok)throw new Error(d.msg||d.message||d.error_description||('HTTP '+r.status));return d}finally{clearTimeout(t)}}
async function login(e){e.preventDefault();msg.className='msg';msg.textContent='Prijavljam ...';$('btn').disabled=true;try{let u=$('user').value.trim(),email=u.includes('@')?u:u+'@maco.si';let a=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:$('pass').value})});token=a.access_token;if(!token)throw new Error('Supabase ni vrnil prijavnega žetona.');let rows=await req('/rest/v1/profiles?id=eq.'+encodeURIComponent(a.user.id)+'&select=*');if(!rows[0]||rows[0].role!=='admin')throw new Error('Uporabnik nima administratorskih pravic.');profile=rows[0];$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');await loadEntries()}catch(x){msg.className='msg err';msg.textContent='Napaka: '+(x.name==='AbortError'?'Supabase povezava je potekla.':x.message)}finally{$('btn').disabled=false}}
async function loadEntries(){try{let d=await req('/rest/v1/time_entries?deleted=eq.false&select=*&order=entry_date.desc,entry_time.desc');$('content').innerHTML='<h2>Evidenca časa</h2><div class="table"><table><tr><th>ID</th><th>Datum</th><th>Čas</th><th>Vrsta</th><th>QR mesto</th><th>GPS</th></tr>'+d.map(x=>`<tr><td>${x.entry_number}</td><td>${x.entry_date}</td><td>${x.entry_time||''}</td><td>${x.entry_type}</td><td>${x.qr_location_name||''}</td><td>${x.gps_latitude||''} ${x.gps_longitude||''}</td></tr>`).join('')+'</table></div>'}catch(x){$('content').innerHTML='<p class="err">'+x.message+'</p>'}}
async function loadUsers(){try{let d=await req('/rest/v1/profiles?select=*&order=last_name.asc');$('content').innerHTML='<h2>Uporabniki</h2><div class="table"><table><tr><th>Username</th><th>Ime</th><th>Delovno mesto</th><th>Vloga</th></tr>'+d.map(x=>`<tr><td>${x.username}</td><td>${x.first_name} ${x.last_name}</td><td>${x.job_title}</td><td>${x.role}</td></tr>`).join('')+'</table></div>'}catch(x){$('content').innerHTML='<p class="err">'+x.message+'</p>'}}
async function loadAudit(){try{let d=await req('/rest/v1/audit_log?select=*&order=changed_at.desc&limit=200');$('content').innerHTML='<h2>Sledljivost</h2>'+d.map(x=>`<p><b>${new Date(x.changed_at).toLocaleString('sl-SI')}</b> · ${x.action} · ${x.table_name} · ${x.record_id}</p>`).join('')}catch(x){$('content').innerHTML='<p class="err">'+x.message+'</p>'}}
$('form').addEventListener('submit',login);$('entries').addEventListener('click',loadEntries);$('users').addEventListener('click',loadUsers);$('audit').addEventListener('click',loadAudit);$('logout').addEventListener('click',()=>location.reload());
})();</script></body></html>
