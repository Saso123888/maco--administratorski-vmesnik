<script>
const BASE='https://gjtenghgidthqmhehxjx.supabase.co',KEY='sb_publishable_msTthlKSK_D8GwxCzh5AEA_FkBak2pM';let token='',admin=null,data={profiles:[],entries:[],settings:null,locations:[],types:[],themes:[],summaries:[],audit:[],shifts:[],weekShifts:[],userShifts:[],absences:[]};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>v?new Date(v).toLocaleDateString('sl-SI'):'-',fmtTime=v=>v?(String(v).includes('T')?new Date(v).toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'}):String(v).slice(0,5)):'-';
function headers(){return{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'}}async function api(path,opt={}){let r=await fetch(BASE+path,{...opt,headers:{...headers(),...(opt.headers||{})}}),t=await r.text(),j={};try{j=t?JSON.parse(t):{}}catch{j={message:t}}if(!r.ok)throw Error(j.message||j.error_description||j.error||('HTTP '+r.status));return j}
function profileName(id){let p=data.profiles.find(x=>x.id===id);return p?`${p.first_name||''} ${p.last_name||''}`.trim()||p.username:id||'-'}function locName(id){let l=data.locations.find(x=>String(x.id)===String(id));return l?.name||'-'}function typeName(e){let t=data.types.find(x=>String(x.id)===String(e.registration_type_id));return t?.name||e.entry_type||e.type||'-'}
async function loadAll(){let q=[['profiles','/rest/v1/profiles?select=*&order=last_name.asc'],['entries','/rest/v1/time_entries?select=*&order=entry_date.desc,entry_time.desc&limit=2000'],['settings','/rest/v1/company_settings?select=*&limit=1'],['locations','/rest/v1/locations?select=*&order=name.asc'],['types','/rest/v1/registration_types?select=*&order=sort_order.asc'],['themes','/rest/v1/app_themes?select=*&order=id.asc'],['summaries','/rest/v1/daily_work_summary?select=*&order=work_date.desc&limit=2000'],['audit','/rest/v1/audit_log?select=*&order=created_at.desc&limit=1000'],['shifts','/rest/v1/location_shifts?select=*&order=location_id,shift_no'],['weekShifts','/rest/v1/location_week_shifts?select=*&order=location_id,weekday,shift_no'],['userShifts','/rest/v1/user_shifts?select=*&order=user_id,shift_no'],['absences','/rest/v1/absence_requests?select=*&order=date_from.desc']];await Promise.all(q.map(async([k,p])=>{try{let x=await api(p);data[k]=k==='settings'?(x[0]||null):x}catch(e){console.warn(k,e.message);data[k]=k==='settings'?null:[]}}));applyBrand()}
function applyBrand(){let s=data.settings||{};$('modeLabel').textContent='ADMIN';if(s.logo_url)$('loginLogo').innerHTML=`<img class="logo" src="${esc(s.logo_url)}" alt="Logotip">`;applyTheme(s.power_theme_code||s.theme_code||'GREEN')}
function applyTheme(code){let t=data.themes.find(x=>x.code===code),map={GREEN:['#22c55e','#166534','#dcfce7','#f4f7f5'],BLUE:['#3b82f6','#1d4ed8','#dbeafe','#f8fafc'],RED:['#ef4444','#b91c1c','#fee2e2','#fff7f7'],WHITE:['#6b7280','#374151','#f3f4f6','#fff'],ORANGE:['#f97316','#c2410c','#ffedd5','#fffaf5']},c=t?[t.primary_color,t.secondary_color,t.accent_color,t.background_color]:map[code]||map.GREEN,r=document.documentElement.style;r.setProperty('--pd',c[0]);r.setProperty('--p',c[1]);r.setProperty('--ps',c[2]);r.setProperty('--bg',c[3])}
async function login(e){e.preventDefault();try{$('loginMsg').className='msg';$('loginMsg').textContent='Prijavljam ...';let u=$('loginUser').value.trim(),a=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:u.includes('@')?u:u+'@maco.si',password:$('loginPass').value})});token=a.access_token;let sess=JSON.stringify({access_token:token,user_id:a.user.id});if($('rememberMe').checked){localStorage.setItem('maco_power_session',sess);sessionStorage.removeItem('maco_power_session')}else{sessionStorage.setItem('maco_power_session',sess);localStorage.removeItem('maco_power_session')}admin=(await api('/rest/v1/profiles?id=eq.'+a.user.id+'&select=*'))[0];if(!admin)throw Error('Profil uporabnika v tabeli profiles ni bil najden.');if(!admin.can_administration)throw Error('Uporabnik nima administratorske pravice.');$('loginPage').classList.add('hidden');$('adminPage').classList.remove('hidden');$('adminLabel').textContent=profileName(admin.id);await loadAll();show('dashboard')}catch(e){$('loginMsg').className='msg error';$('loginMsg').textContent=e.message}}
async function restore(){try{let raw=localStorage.getItem('maco_power_session')||sessionStorage.getItem('maco_power_session')||'{}',s=JSON.parse(raw);if(!s.access_token)return;token=s.access_token;admin=(await api('/rest/v1/profiles?id=eq.'+s.user_id+'&select=*'))[0];if(!admin?.can_administration)return;$('loginPage').classList.add('hidden');$('adminPage').classList.remove('hidden');await loadAll();$('adminLabel').textContent=profileName(admin.id);show('dashboard')}catch{localStorage.removeItem('maco_power_session')}}
function show(name){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));let f={dashboard,entries,users,reports,audit,settings};$('pageTitle').textContent={dashboard:'Nadzorna plošča',entries:'Evidenca časa',users:'Uporabniki',reports:'Poročila',audit:'Sledljivost',settings:'Nastavitve'}[name];f[name]()}
function dashboard(){let today=new Date().toISOString().slice(0,10),te=data.entries.filter(x=>String(x.entry_date||x.created_at).slice(0,10)===today),arr=te.filter(x=>typeName(x).toUpperCase().includes('PRIHOD')).length,dep=te.filter(x=>typeName(x).toUpperCase().includes('ODHOD')).length,errs=data.summaries.filter(x=>x.day_status==='ERROR').length;$('view').innerHTML=`<div class="head"><div><h1>Nadzorna plošča</h1><p>Pregled prisotnosti, ur in poslovalnic</p></div><button class="btn secondary" onclick="print()">Natisni</button></div><div class="grid metrics"><div class="metric"><span class="ico">♙</span><strong>${data.profiles.filter(x=>x.active).length}</strong><small>Aktivni uporabniki</small></div><div class="metric"><span class="ico">↘</span><strong>${arr}</strong><small>Današnji prihodi</small></div><div class="metric"><span class="ico">↗</span><strong>${dep}</strong><small>Današnji odhodi</small></div><div class="metric"><span class="ico">⌂</span><strong>${data.locations.filter(x=>x.active!==false).length}</strong><small>Aktivne poslovalnice</small></div></div><div class="grid two" style="margin-top:14px"><div class="panel"><h3>Zadnje registracije</h3>${entryTable(te.slice(0,8),false)}</div><div class="panel"><h3>Kontrola dni</h3><div class="bars"><div class="barrow"><span>V redu</span><div class="bar"><i style="width:70%"></i></div><b>${data.summaries.filter(x=>x.day_status==='OK').length}</b></div><div class="barrow"><span>Opozorilo</span><div class="bar"><i style="width:40%;background:var(--orange)"></i></div><b>${data.summaries.filter(x=>x.day_status==='WARNING').length}</b></div><div class="barrow"><span>Napaka</span><div class="bar"><i style="width:25%;background:var(--red)"></i></div><b>${errs}</b></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Odsotnosti v obravnavi</h3><strong style="font-size:32px">${data.absences.filter(x=>x.status==='PENDING').length}</strong></div></div>`}
function entryTable(rows,edit=true){return `<div class="tablewrap"><table><thead><tr><th>Datum</th><th>Čas</th><th>Ime in priimek</th><th>Vrsta</th><th>Poslovalnica</th><th>GPS</th><th>Zemljevid</th>${edit?'<th></th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td>${fmtDate(x.entry_date||x.created_at)}</td><td>${fmtTime(x.entry_time||x.created_at)}</td><td>${esc(profileName(x.user_id))}</td><td class="type-${esc((x.entry_type||'').toUpperCase())}">${esc(typeName(x))}</td><td>${esc(locName(x.location_id))}</td><td>${x.gps_latitude?Number(x.gps_latitude).toFixed(5)+', '+Number(x.gps_longitude).toFixed(5):'-'}</td><td>${x.gps_latitude?`<a target="_blank" href="https://www.google.com/maps?q=${x.gps_latitude},${x.gps_longitude}">Google Maps</a>`:'-'}</td>${edit?`<td><button class="btn small secondary" onclick="editEntry('${x.id}')">Uredi</button></td>`:''}</tr>`).join('')||`<tr><td colspan="8">Ni podatkov.</td></tr>`}</tbody></table></div>`}
function entries(){let locOpts=data.locations.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('view').innerHTML=`<div class="head"><div><h1>Evidenca časa</h1><p>Vsi dogodki z možnostjo popravka</p></div><button class="btn secondary" onclick="print()">Natisni</button></div><div class="toolbar"><div class="field"><label>Od</label><input id="efrom" type="date"></div><div class="field"><label>Do</label><input id="eto" type="date"></div><div class="field"><label>Zaposleni</label><select id="euser"><option value="">Vsi</option>${data.profiles.map(x=>`<option value="${x.id}">${esc(profileName(x.id))}</option>`).join('')}</select></div><div class="field"><label>Poslovalnica</label><select id="eloc"><option value="">Vse</option>${locOpts}</select></div><div class="field"><label>Vrsta</label><select id="etype"><option value="">Vse</option>${data.types.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><button id="applyE" class="btn">Filtriraj</button></div><div id="entryList">${entryTable(data.entries)}</div>`;$('applyE').onclick=()=>{let a=$('efrom').value,b=$('eto').value,u=$('euser').value,l=$('eloc').value,t=$('etype').value.toLowerCase(),r=data.entries.filter(x=>{let d=String(x.entry_date||x.created_at).slice(0,10);return(!a||d>=a)&&(!b||d<=b)&&(!u||x.user_id===u)&&(!l||String(x.location_id)===l)&&(!t||typeName(x).toLowerCase()===t)});$('entryList').innerHTML=entryTable(r)}}
window.editEntry=id=>{let e=data.entries.find(x=>String(x.id)===String(id));openDrawer('Uredi registracijo',`<div class="formgrid"><div class="field"><label>Datum</label><input id="edDate" type="date" value="${String(e.entry_date||e.created_at).slice(0,10)}"></div><div class="field"><label>Čas</label><input id="edTime" type="time" value="${String(e.entry_time||'').slice(0,5)}"></div><div class="field full"><label>Razlog spremembe</label><textarea id="edReason"></textarea></div></div><button id="saveEntry" class="btn">Shrani popravek</button><div id="edMsg"></div>`);$('saveEntry').onclick=async()=>{try{await api('/rest/v1/time_entries?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({entry_date:$('edDate').value,entry_time:$('edTime').value,edited_by:admin.id,edited_at:new Date().toISOString(),edit_reason:$('edReason').value})});$('edMsg').className='msg ok';$('edMsg').textContent='Shranjeno.';await loadAll();entries()}catch(x){$('edMsg').className='msg error';$('edMsg').textContent=x.message}}}
function users(){$('view').innerHTML=`<div class="head"><div><h1>Uporabniki</h1><p>Poslovalnice, norme, izmene in administratorske pravice</p></div><button class="btn" onclick="editUser('')">＋ Nov uporabnik</button></div><div class="tablewrap"><table><thead><tr><th>Ime in priimek</th><th>Uporabnik</th><th>Poslovalnica</th><th>Norma</th><th>Izmene</th><th>Kontrola</th><th>Pravice</th><th></th></tr></thead><tbody>${data.profiles.map(p=>`<tr><td>${esc(profileName(p.id))}</td><td>${esc(p.username)}</td><td>${esc(locName(p.default_location_id||p.location_id))}</td><td>${Math.floor((p.daily_work_minutes||480)/60)}:${String((p.daily_work_minutes||480)%60).padStart(2,'0')} h</td><td>${p.shift_count||1}</td><td>${esc(p.time_control_mode||'WARN')}</td><td>${p.is_global_admin?'Globalni admin':p.can_administration?'Admin':'Uporabnik'}</td><td><button class="btn small secondary" onclick="editUser('${p.id}')">Uredi</button></td></tr>`).join('')}</tbody></table></div>`}
window.editUser=id=>{let p=data.profiles.find(x=>x.id===id)||{},isNew=!id;openDrawer(isNew?'Nov uporabnik':'Uredi uporabnika',`<div class="formgrid"><div class="field"><label>Ime</label><input id="uFirst" value="${esc(p.first_name||'')}"></div><div class="field"><label>Priimek</label><input id="uLast" value="${esc(p.last_name||'')}"></div><div class="field"><label>Uporabniško ime</label><input id="uName" value="${esc(p.username||'')}"></div><div class="field"><label>Jezik</label><select id="uLang"><option value="">Privzeti</option><option>SL</option><option>EN</option><option>HR</option></select></div><div class="field"><label>Poslovalnica</label><select id="uLoc"><option value="">Brez</option>${data.locations.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Dnevni delovnik (min)</label><input id="uMinutes" type="number" value="${p.daily_work_minutes||480}"></div><div class="field"><label>Število izmen</label><select id="uShiftCount"><option>1</option><option>2</option><option>3</option></select></div><div class="field"><label>Kontrola časa</label><select id="uControl"><option value="NONE">Brez</option><option value="WARN">Opozori</option><option value="BLOCK">Blokiraj</option></select></div><label><input id="uAdmin" type="checkbox" ${p.can_administration?'checked':''}> Administrator</label><label><input id="uGlobal" type="checkbox" ${p.is_global_admin?'checked':''}> Globalni administrator</label><label><input id="uActive" type="checkbox" ${p.active!==false?'checked':''}> Aktiven</label></div><div class="section">Individualne izmene</div><div id="userShiftBox"></div><button id="saveUserBtn" class="btn">Shrani uporabnika</button><div id="uMsg"></div>`);$('uLang').value=p.language||'';$('uLoc').value=p.default_location_id||p.location_id||'';$('uShiftCount').value=p.shift_count||1;$('uControl').value=p.time_control_mode||'WARN';renderUserShiftInputs(p);$('uShiftCount').onchange=()=>renderUserShiftInputs(p);$('saveUserBtn').onclick=async()=>{if(isNew){$('uMsg').className='msg error';$('uMsg').textContent='Kreiranje novega Auth uporabnika ostaja prek funkcije admin-users.';return}let body={first_name:$('uFirst').value,last_name:$('uLast').value,username:$('uName').value,language:$('uLang').value||null,default_location_id:$('uLoc').value||null,daily_work_minutes:+$('uMinutes').value||480,shift_count:+$('uShiftCount').value,time_control_mode:$('uControl').value,can_administration:$('uAdmin').checked,is_global_admin:$('uGlobal').checked,active:$('uActive').checked};try{await api('/rest/v1/profiles?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});for(let i=1;i<=body.shift_count;i++){let sb={user_id:id,shift_no:i,shift_name:'Izmena '+i,start_time:$('us'+i+'a').value,end_time:$('us'+i+'b').value,daily_work_minutes:+$('us'+i+'m').value||body.daily_work_minutes,early_arrival_minutes:30,late_departure_minutes:60,active:true};await api('/rest/v1/user_shifts?on_conflict=user_id,shift_no',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(sb)})}await loadAll();$('uMsg').className='msg ok';$('uMsg').textContent='Shranjeno.';users()}catch(e){$('uMsg').className='msg error';$('uMsg').textContent=e.message}}}
function renderUserShiftInputs(p){let n=+$('uShiftCount').value||1,us=data.userShifts.filter(x=>x.user_id===p.id);$('userShiftBox').innerHTML=Array.from({length:n},(_,j)=>{let i=j+1,x=us.find(y=>y.shift_no===i)||{};return `<div class="shift-card"><b>Izmena ${i}</b><div class="shiftrow"><span></span><div class="field"><label>Od</label><input id="us${i}a" type="time" value="${String(x.start_time||['06:00','14:00','22:00'][j]).slice(0,5)}"></div><div class="field"><label>Do</label><input id="us${i}b" type="time" value="${String(x.end_time||['14:00','22:00','06:00'][j]).slice(0,5)}"></div><div class="field"><label>Norma min</label><input id="us${i}m" type="number" value="${x.daily_work_minutes||p.daily_work_minutes||480}"></div></div></div>`}).join('')}
function reports(){let rows=data.summaries;$('view').innerHTML=`<div class="head"><div><h1>Poročila</h1><p>Dnevne ure, odsotnosti in statusi</p></div><div><button class="btn secondary" onclick="print()">Natisni / PDF</button></div></div><div class="toolbar"><div class="field"><label>Od</label><input id="rfrom" type="date"></div><div class="field"><label>Do</label><input id="rto" type="date"></div><div class="field"><label>Zaposleni</label><select id="ruser"><option value="">Vsi</option>${data.profiles.map(x=>`<option value="${x.id}">${esc(profileName(x.id))}</option>`).join('')}</select></div><div class="field"><label>Poslovalnica</label><select id="rloc"><option value="">Vse</option>${data.locations.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><button id="applyR" class="btn">Filtriraj</button></div><div id="reportTable">${reportTable(rows)}</div>`;$('applyR').onclick=()=>{let a=$('rfrom').value,b=$('rto').value,u=$('ruser').value,l=$('rloc').value,r=rows.filter(x=>(!a||x.work_date>=a)&&(!b||x.work_date<=b)&&(!u||x.user_id===u)&&(!l||String(x.location_id)===l));$('reportTable').innerHTML=reportTable(r)}}
function reportTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Datum</th><th>Zaposleni</th><th>Poslovalnica</th><th>Prihod</th><th>Odhod</th><th>Pričakovano</th><th>Opravljeno</th><th>Manjka</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${fmtDate(x.work_date)}</td><td>${esc(profileName(x.user_id))}</td><td>${esc(locName(x.location_id))}</td><td>${fmtTime(x.first_arrival)}</td><td>${fmtTime(x.last_departure)}</td><td>${Math.round((x.expected_work_minutes||0)/60*100)/100} h</td><td>${Math.round((x.worked_minutes||0)/60*100)/100} h</td><td>${Math.round((x.missing_work_minutes||0)/60*100)/100} h</td><td><span class="pill ${x.day_status==='OK'?'ok':x.day_status==='WARNING'?'warn':'err'}">${x.day_status||'ERROR'}</span></td></tr>`).join('')||'<tr><td colspan="9">Ni dnevnih povzetkov.</td></tr>'}</tbody></table></div>`}
function audit(){$('view').innerHTML=`<div class="head"><div><h1>Sledljivost</h1><p>Kdo je dodal ali spremenil zapis</p></div><button class="btn secondary" onclick="print()">Natisni</button></div><div class="toolbar"><div class="field"><label>Uporabnik</label><input id="afind" placeholder="Ime ali dejanje"></div><div class="field"><label>Od</label><input id="afrom" type="date"></div><div class="field"><label>Do</label><input id="ato" type="date"></div><button id="applyA" class="btn">Filtriraj</button></div><div id="auditList">${auditTable(data.audit)}</div>`;$('applyA').onclick=()=>{let q=$('afind').value.toLowerCase(),a=$('afrom').value,b=$('ato').value,r=data.audit.filter(x=>{let d=String(x.created_at).slice(0,10),txt=(profileName(x.changed_by||x.user_id)+' '+(x.action||'')+' '+(x.table_name||'')).toLowerCase();return(!q||txt.includes(q))&&(!a||d>=a)&&(!b||d<=b)});$('auditList').innerHTML=auditTable(r)}}
function auditTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Datum in čas</th><th>Uporabnik</th><th>Dejanje</th><th>Modul</th><th>Poslovalnica</th><th>Stara vrednost</th><th>Nova vrednost</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('sl-SI')}</td><td>${esc(profileName(x.changed_by||x.user_id))}</td><td>${esc(x.action)}</td><td>${esc(x.table_name)}</td><td>${esc(locName(x.location_id))}</td><td>${esc(x.old_value||'-')}</td><td>${esc(x.new_value||'-')}</td></tr>`).join('')||'<tr><td colspan="7">Ni zapisov.</td></tr>'}</tbody></table></div>`}
function settings(){let s=data.settings||{},first=data.locations[0]||{};$('view').innerHTML=`<div class="head"><div><h1>Nastavitve</h1><p>POWER podjetje, poslovalnice, izmene, vrste, jezik in teme</p></div><button id="saveCompany" class="btn">Shrani podjetje</button></div><div id="setMsg"></div><div class="grid two"><div class="panel"><h3>Podjetje in prva poslovalnica</h3><div class="formgrid"><div class="field full"><label>Naziv podjetja</label><input id="cName" value="${esc(s.company_name||'MACO')}"></div><div class="field full"><label>Naslov</label><input id="cAddress" value="${esc(s.company_address||'')}"></div><div class="field"><label>Način</label><select id="cMode"><option>LIGHT</option><option>POWER</option></select></div><div class="field"><label>Privzeti jezik</label><select id="cLang"><option>SL</option><option>EN</option><option>HR</option></select></div></div></div><div class="panel"><h3>Logotip</h3>${s.logo_url?`<img class="logo" src="${esc(s.logo_url)}">`:'<p class="muted">Logotip ni naložen.</p>'}<div class="field"><label>Naloži nov logotip</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></div></div></div><div class="panel" style="margin-top:14px"><div class="cardhead"><div><h3>Poslovalnice</h3><p class="muted">Vsaka ima svoj naslov, GPS, radij in izmene.</p></div><button id="addLoc" class="btn">＋ Poslovalnica</button></div><div id="locCards">${locationCards()}</div></div><div class="panel" style="margin-top:14px"><h3>Tema POWER</h3><div class="themegrid">${data.themes.map(t=>`<button class="theme ${t.code===(s.power_theme_code||'GREEN')?'active':''}" data-theme="${t.code}"><div class="swatch" style="background:${t.primary_color}"></div><b>${esc(t.name_sl)}</b></button>`).join('')}</div></div><div class="panel" style="margin-top:14px"><h3>Vrste registracije</h3><div class="tablewrap"><table><thead><tr><th>Vrsta</th><th>GPS</th><th>Delo od doma</th><th>Potrditev</th><th>Aktivna</th></tr></thead><tbody>${data.types.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.enforce_location?'Da':'Ne'}</td><td>${t.remote_mode?'Da':'Ne'}</td><td>${t.requires_approval?'Da':'Ne'}</td><td>${t.active?'Da':'Ne'}</td></tr>`).join('')}</tbody></table></div></div>`;$('cMode').value=s.admin_mode||'POWER';$('cLang').value=s.default_language||'SL';document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-theme]').forEach(x=>x.classList.remove('active'));b.classList.add('active');applyTheme(b.dataset.theme)});$('saveCompany').onclick=saveCompany;$('addLoc').onclick=()=>editLocation('');document.querySelectorAll('[data-editloc]').forEach(b=>b.onclick=()=>editLocation(b.dataset.editloc))}
function locationCards(){return data.locations.map(l=>`<div class="location-card"><div class="cardhead"><div><h3>${esc(l.name)}</h3><div class="muted">${esc([l.address,l.postal_code,l.city].filter(Boolean).join(', '))}</div></div><button class="btn small secondary" data-editloc="${l.id}">Uredi</button></div><div class="gpsbox">GPS: ${l.latitude||'-'}, ${l.longitude||'-'} · Radij: ${l.allowed_radius_m||200} m · Prazniki: ${l.holiday_mode||'CLOSED'}</div><div class="section">Izmene</div>${data.shifts.filter(x=>String(x.location_id)===String(l.id)).map(x=>`<div class="shift-card">${esc(x.shift_name||'Izmena '+x.shift_no)}: <b>${fmtTime(x.start_time)}–${fmtTime(x.end_time)}</b>, norma ${x.daily_work_minutes} min</div>`).join('')||'<span class="muted">Ni nastavljenih izmen.</span>'}</div>`).join('')||'<div class="muted">Poslovalnice še ni. Podjetje bo hkrati prva poslovalnica.</div>'}
async function saveCompany(){try{let theme=document.querySelector('[data-theme].active')?.dataset.theme||'GREEN',body={company_name:$('cName').value,company_address:$('cAddress').value,admin_mode:$('cMode').value,default_language:$('cLang').value,power_theme_code:theme,updated_at:new Date().toISOString()},f=$('logoFile').files[0];if(f){let n='company-logo-'+Date.now()+'.'+f.name.split('.').pop(),r=await fetch(BASE+'/storage/v1/object/company-assets/'+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':f.type},body:f});if(!r.ok)throw Error(await r.text());body.logo_url=BASE+'/storage/v1/object/public/company-assets/'+n}await api('/rest/v1/company_settings?id=eq.'+data.settings.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});await loadAll();$('setMsg').className='msg ok';$('setMsg').textContent='Shranjeno.';settings()}catch(e){$('setMsg').className='msg error';$('setMsg').textContent=e.message}}
function editLocation(id){let l=data.locations.find(x=>String(x.id)===String(id))||{},isNew=!id,ls=data.shifts.filter(x=>String(x.location_id)===String(id));openDrawer(isNew?'Nova poslovalnica':'Uredi poslovalnico',`<div class="formgrid"><div class="field"><label>Ime</label><input id="lName" value="${esc(l.name||'')}"></div><div class="field"><label>Naslov</label><input id="lAddress" value="${esc(l.address||'')}"></div><div class="field"><label>Poštna št.</label><input id="lPost" value="${esc(l.postal_code||'')}"></div><div class="field"><label>Kraj</label><input id="lCity" value="${esc(l.city||'')}"></div><div class="field"><label>GPS širina</label><input id="lLat" value="${l.latitude||''}"></div><div class="field"><label>GPS dolžina</label><input id="lLon" value="${l.longitude||''}"></div><div class="field"><label>Radij (m)</label><input id="lRadius" type="number" value="${l.allowed_radius_m||200}"></div><div class="field"><label>Prazniki</label><select id="lHoliday"><option>CLOSED</option><option>NORMAL</option><option>SUNDAY</option><option>SPECIAL</option></select></div></div><div class="toolbar"><button id="gpsNow" class="btn secondary">Uporabi trenutni GPS</button><button id="mapAddress" class="btn secondary">Poišči naslov na Google Maps</button></div><div class="section">Izmene</div><div id="locShiftBox">${Array.from({length:3},(_,j)=>{let i=j+1,x=ls.find(y=>y.shift_no===i)||{};return `<div class="shift-card"><label><input id="ls${i}on" type="checkbox" ${x.active||x.id?'checked':''}> Izmena ${i}</label><div class="shiftrow"><span></span><input id="ls${i}a" type="time" value="${String(x.start_time||['06:00','14:00','22:00'][j]).slice(0,5)}"><input id="ls${i}b" type="time" value="${String(x.end_time||['14:00','22:00','06:00'][j]).slice(0,5)}"><input id="ls${i}m" type="number" value="${x.daily_work_minutes||480}"></div></div>`}).join('')}</div><button id="saveLoc" class="btn">Shrani poslovalnico</button><div id="lMsg"></div>`);$('lHoliday').value=l.holiday_mode||'CLOSED';$('gpsNow').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{$('lLat').value=p.coords.latitude.toFixed(7);$('lLon').value=p.coords.longitude.toFixed(7)},e=>alert(e.message),{enableHighAccuracy:true});$('mapAddress').onclick=()=>window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([$('lAddress').value,$('lPost').value,$('lCity').value].filter(Boolean).join(', ')),'_blank');$('saveLoc').onclick=async()=>{try{let body={name:$('lName').value,address:$('lAddress').value,postal_code:$('lPost').value,city:$('lCity').value,country:'Slovenija',country_code:'SI',latitude:$('lLat').value||null,longitude:$('lLon').value||null,allowed_radius_m:+$('lRadius').value||200,holiday_mode:$('lHoliday').value,active:true,updated_at:new Date().toISOString()},lid=id;if(isNew){let r=await api('/rest/v1/locations',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});lid=r[0].id}else await api('/rest/v1/locations?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});for(let i=1;i<=3;i++){if(!$('ls'+i+'on').checked)continue;let sb={location_id:lid,shift_no:i,shift_name:'Izmena '+i,start_time:$('ls'+i+'a').value,end_time:$('ls'+i+'b').value,daily_work_minutes:+$('ls'+i+'m').value||480,early_arrival_minutes:30,late_departure_minutes:60,active:true};await api('/rest/v1/location_shifts?on_conflict=location_id,shift_no',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(sb)})}await loadAll();$('lMsg').className='msg ok';$('lMsg').textContent='Shranjeno.';settings()}catch(e){$('lMsg').className='msg error';$('lMsg').textContent=e.message}}}
function openDrawer(title,body){$('drawerTitle').textContent=title;$('drawerBody').innerHTML=body;$('drawer').classList.remove('hidden')}
$('closeDrawer').onclick=()=>$('drawer').classList.add('hidden');$('rememberMe').checked=localStorage.getItem('maco_remember')!=='0';$('rememberMe').onchange=()=>localStorage.setItem('maco_remember',$('rememberMe').checked?'1':'0');$('loginForm').onsubmit=login;$('logout').onclick=()=>{localStorage.removeItem('maco_power_session');sessionStorage.removeItem('maco_power_session');location.reload()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));restore();
</script></body></html>
