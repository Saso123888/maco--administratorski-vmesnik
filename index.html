<script>
const BASE='https://gjtenghgidthqmhehxjx.supabase.co',KEY='sb_publishable_msTthlKSK_D8GwxCzh5AEA_FkBak2pM';let token='',admin=null,data={profiles:[],entries:[],settings:null,locations:[],types:[],themes:[],summaries:[],audit:[],shifts:[],weekShifts:[],userShifts:[],absences:[],jobTitles:[],jobTitleLocations:[]};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>v?new Date(v).toLocaleDateString('sl-SI'):'-',fmtTime=v=>v?(String(v).includes('T')?new Date(v).toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'}):String(v).slice(0,5)):'-';
function headers(){return{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'}}async function api(path,opt={}){let r=await fetch(BASE+path,{...opt,headers:{...headers(),...(opt.headers||{})}}),t=await r.text(),j={};try{j=t?JSON.parse(t):{}}catch{j={message:t}}if(!r.ok)throw Error(j.message||j.error_description||j.error||('HTTP '+r.status));return j}
function profileName(id){let p=data.profiles.find(x=>x.id===id);return p?`${p.first_name||''} ${p.last_name||''}`.trim()||p.username:id||'-'}function locName(id){let l=data.locations.find(x=>String(x.id)===String(id));return l?.name||'-'}function typeName(e){let t=data.types.find(x=>String(x.id)===String(e.registration_type_id));return t?.name||e.entry_type||e.type||'-'}
async function loadAll(){let q=[['profiles','/rest/v1/profiles?select=*&order=last_name.asc'],['entries','/rest/v1/time_entries?select=*&order=entry_date.desc,entry_time.desc&limit=2000'],['settings','/rest/v1/company_settings?select=*&limit=1'],['locations','/rest/v1/locations?select=*&order=name.asc'],['types','/rest/v1/registration_types?select=*&order=sort_order.asc'],['themes','/rest/v1/app_themes?select=*&order=id.asc'],['summaries','/rest/v1/daily_work_summary?select=*&order=work_date.desc&limit=2000'],['audit','/rest/v1/audit_log_view?select=*&order=changed_at.desc&limit=100'],['shifts','/rest/v1/location_shifts?select=*&order=location_id,shift_no'],['weekShifts','/rest/v1/location_week_shifts?select=*&order=location_id,weekday,shift_no'],['userShifts','/rest/v1/user_shifts?select=*&order=user_id,shift_no'],['absences','/rest/v1/absence_requests?select=*&order=date_from.desc'],['jobTitles','/rest/v1/job_titles?select=*&order=sort_order.asc,name.asc'],['jobTitleLocations','/rest/v1/job_title_locations?select=*']];for(const [k,path] of q){try{let r=await api(path);data[k]=(k==='settings')?(Array.isArray(r)?(r[0]||null):r):(Array.isArray(r)?(k==='audit'?r.slice(0,100):r):[]);}catch(e){console.warn('load '+k,e);if(k==='settings')data[k]=data[k]||null;else if(!Array.isArray(data[k]))data[k]=[];}}applyBrand();}
function applyBrand(){let s=data.settings||{},brandName=$('brandName'),modeLabel=$('modeLabel'),loginLogo=$('loginLogo');if(brandName)brandName.textContent='TeamMate';if(modeLabel)modeLabel.textContent='POWER';if(loginLogo&&s.logo_url)loginLogo.innerHTML=`<img class="logo" src="${esc(s.logo_url)}" alt="Logotip">`;applyTheme(s.power_theme_code||s.theme_code||'GREEN')}
function applyTheme(code){let t=data.themes.find(x=>x.code===code),map={GREEN:['#22c55e','#166534','#dcfce7','#f4f7f5'],BLUE:['#3b82f6','#1d4ed8','#dbeafe','#f8fafc'],RED:['#ef4444','#b91c1c','#fee2e2','#fff7f7'],WHITE:['#6b7280','#374151','#f3f4f6','#fff'],ORANGE:['#f97316','#c2410c','#ffedd5','#fffaf5']},c=t?[t.primary_color,t.secondary_color,t.accent_color,t.background_color]:map[code]||map.GREEN,r=document.documentElement.style;r.setProperty('--pd',c[0]);r.setProperty('--p',c[1]);r.setProperty('--ps',c[2]);r.setProperty('--bg',c[3])}
async function login(e){e.preventDefault();try{$('loginMsg').className='msg';$('loginMsg').textContent='Prijavljam ...';let u=$('loginUser').value.trim(),a=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:u.includes('@')?u:u+'@maco.si',password:$('loginPass').value})});token=a.access_token;let sess=JSON.stringify({access_token:token,user_id:a.user.id});if($('rememberMe').checked){localStorage.setItem('maco_power_session',sess);sessionStorage.removeItem('maco_power_session')}else{sessionStorage.setItem('maco_power_session',sess);localStorage.removeItem('maco_power_session')}admin=(await api('/rest/v1/profiles?id=eq.'+a.user.id+'&select=*'))[0];if(!admin)throw Error('Profil uporabnika v tabeli profiles ni bil najden.');if(!admin.can_administration)throw Error('Uporabnik nima administratorske pravice.');$('loginPage').classList.add('hidden');$('adminPage').classList.remove('hidden');await loadAll();$('adminLabel').textContent=profileName(admin.id);show('home')}catch(e){$('loginMsg').className='msg error';$('loginMsg').textContent=e.message}}
async function restore(){try{let raw=localStorage.getItem('maco_power_session')||sessionStorage.getItem('maco_power_session')||'{}',s=JSON.parse(raw);if(!s.access_token)return;token=s.access_token;admin=(await api('/rest/v1/profiles?id=eq.'+s.user_id+'&select=*'))[0];if(!admin?.can_administration)return;$('loginPage').classList.add('hidden');$('adminPage').classList.remove('hidden');await loadAll();$('adminLabel').textContent=profileName(admin.id);show('home')}catch{localStorage.removeItem('maco_power_session')}}

function show(name){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));let f={home,company,locations,entries,users,reports,audit};$('pageTitle').textContent={home:'TeamMate ADMIN',company:'Podjetje',locations:'Poslovalnice',entries:'Evidenca časa',users:'Uporabniki',reports:'Poročila',audit:'Logiranje'}[name]||'TeamMate ADMIN';if(f[name])f[name]()}
function backBtn(){return `<button type="button" class="btn secondary small" onclick="show('home')">← Nazaj</button>`}
function home(){$('view').innerHTML=`<div class="head"><div><h1>TeamMate ADMIN</h1><p>Izberi modul za upravljanje sistema.</p></div></div><div class="core-modules"><button class="core-module" onclick="show('company')"><span>🏢</span><b>Podjetje</b><small>Naziv, naslov in jezik podjetja</small></button><button class="core-module" onclick="show('entries')"><span>◷</span><b>Evidenca časa</b><small>Pregled in urejanje registracij</small></button><button class="core-module" onclick="show('users')"><span>♙</span><b>Uporabniki</b><small>Zaposleni, pravice in dostopi</small></button><button class="core-module" onclick="show('reports')"><span>▥</span><b>Poročila</b><small>Obračuni, tisk in izvoz</small></button><button class="core-module" onclick="show('locations')"><span>⌂</span><b>Poslovalnice</b><small>Lokacije, GPS, radiji in izmene</small></button><button class="core-module" onclick="show('audit')"><span>◎</span><b>Logiranje</b><small>Revizijska sled sprememb in dogodkov</small></button></div>`}

function entryTable(rows,edit=true){return `<div class="tablewrap"><table><thead><tr><th>Datum</th><th>Čas</th><th>Ime in priimek</th><th>Vrsta</th><th>Poslovalnica</th><th>GPS</th><th>Zemljevid</th>${edit?'<th></th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td>${fmtDate(x.entry_date||x.created_at)}</td><td>${fmtTime(x.entry_time||x.created_at)}</td><td>${esc(profileName(x.user_id))}</td><td class="type-${esc((x.entry_type||'').toUpperCase())}">${esc(typeName(x))}</td><td>${esc(locName(x.location_id))}</td><td>${x.gps_latitude?Number(x.gps_latitude).toFixed(5)+', '+Number(x.gps_longitude).toFixed(5):'-'}</td><td>${x.gps_latitude?`<a target="_blank" href="https://www.google.com/maps?q=${x.gps_latitude},${x.gps_longitude}">Google Maps</a>`:'-'}</td>${edit?`<td><button class="btn small secondary" onclick="editEntry('${x.id}')">Uredi</button></td>`:''}</tr>`).join('')||`<tr><td colspan="8">Ni podatkov.</td></tr>`}</tbody></table></div>`}
function company(){let c=data.settings||{};$('view').innerHTML=`<div class="head"><div>${backBtn()}</div><div><h1>Podjetje</h1><p>Osnovni podatki iz tabele company_settings</p></div><button id="saveCompanyCore" class="btn">Shrani</button></div><div id="companyMsg"></div><div class="panel"><div class="formgrid"><div class="field full"><label>Naziv podjetja</label><input id="coName" value="${esc(c.company_name||'')}"></div><div class="field full"><label>Naslov podjetja</label><input id="coAddress" value="${esc(c.company_address||'')}"></div><div class="field"><label>Privzeti jezik</label><select id="coLanguage"><option value="SL">Slovenščina (SL)</option><option value="EN">English (EN)</option><option value="HR">Hrvatski (HR)</option></select></div></div></div>`;$('coLanguage').value=c.default_language||'SL';$('saveCompanyCore').onclick=saveCompanyCore}
async function saveCompanyCore(){let body={company_name:$('coName').value.trim(),company_address:$('coAddress').value.trim(),default_language:$('coLanguage').value,updated_at:new Date().toISOString()};try{if(data.settings?.id)await api('/rest/v1/company_settings?id=eq.'+data.settings.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});else await api('/rest/v1/company_settings',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});await loadAll();$('companyMsg').className='msg ok';$('companyMsg').textContent='Podatki podjetja so shranjeni.';company()}catch(e){$('companyMsg').className='msg error';$('companyMsg').textContent=e.message}}
function entries(){let locations=Array.isArray(data.locations)?data.locations:[],profiles=Array.isArray(data.profiles)?data.profiles:[],types=Array.isArray(data.types)?data.types:[],entriesList=Array.isArray(data.entries)?data.entries:[];let locOpts=locations.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('view').innerHTML=`<div class="head"><div>${backBtn()}</div><div><h1>Evidenca časa</h1><p>Vsi dogodki z možnostjo popravka</p></div><button class="btn secondary" onclick="print()">Natisni</button></div><div class="toolbar"><div class="field"><label>Od</label><input id="efrom" type="date"></div><div class="field"><label>Do</label><input id="eto" type="date"></div><div class="field"><label>Zaposleni</label><select id="euser"><option value="">Vsi</option>${profiles.map(x=>`<option value="${x.id}">${esc(profileName(x.id))}</option>`).join('')}</select></div><div class="field"><label>Poslovalnica</label><select id="eloc"><option value="">Vse</option>${locOpts}</select></div><div class="field"><label>Vrsta</label><select id="etype"><option value="">Vse</option>${types.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><button id="applyE" class="btn">Filtriraj</button></div><div id="entryList">${entryTable(entriesList)}</div>`;$('applyE').onclick=()=>{let a=$('efrom').value,b=$('eto').value,u=$('euser').value,l=$('eloc').value,t=$('etype').value.toLowerCase(),r=entriesList.filter(x=>{let d=String(x.entry_date||x.created_at).slice(0,10);return(!a||d>=a)&&(!b||d<=b)&&(!u||x.user_id===u)&&(!l||String(x.location_id)===l)&&(!t||typeName(x).toLowerCase()===t)});$('entryList').innerHTML=entryTable(r)}}

async function deleteJobTitle(jobTitleId,locationId){let j=data.jobTitles.find(x=>String(x.id)===String(jobTitleId));if(!j)return;let used=jobTitleUsageCount(jobTitleId);if(used>0){if(!confirm(`Delovno mesto »${j.name}« uporablja ${used} uporabnik(ov). Ni ga mogoče izbrisati. Želiš ga deaktivirati?`))return;try{await api('/rest/v1/job_titles?id=eq.'+jobTitleId,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({active:false})});await loadAll();renderJobTitlePicker(locationId)}catch(e){$('jobTitleMsg').className='msg error';$('jobTitleMsg').textContent=e.message}return}if(!confirm(`Res želiš izbrisati delovno mesto »${j.name}«?`))return;try{await api('/rest/v1/job_title_locations?job_title_id=eq.'+jobTitleId,{method:'DELETE',headers:{Prefer:'return=minimal'}});await api('/rest/v1/job_titles?id=eq.'+jobTitleId,{method:'DELETE',headers:{Prefer:'return=minimal'}});await loadAll();renderJobTitlePicker(locationId)}catch(e){$('jobTitleMsg').className='msg error';$('jobTitleMsg').textContent=e.message}}
function renderJobTitlePicker(locationId){let box=$('jobTitleBox');if(!box)return;let linked=new Set(data.jobTitleLocations.filter(x=>String(x.location_id)===String(locationId)&&x.active!==false).map(x=>String(x.job_title_id)));let rows=data.jobTitles.filter(j=>j.active!==false).map(j=>{let checked=j.is_global||linked.has(String(j.id)),disabled=j.is_global?'disabled':'';return `<div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><label style="display:flex;align-items:center;gap:9px"><input type="checkbox" data-jt="${j.id}" ${checked?'checked':''} ${disabled}> <span>${esc(j.name)}${j.is_global?' <span class="pill ok">Globalno</span>':''}</span></label><div style="display:flex;gap:6px;align-items:center"><span class="muted">${jobTitleUsageCount(j.id)} uporab.</span>${j.is_global?'':`<button type="button" class="btn small danger" data-deljt="${j.id}">Izbriši</button>`}</div></div>`}).join('')||'<div class="muted">Ni delovnih mest.</div>';box.innerHTML=rows;box.querySelectorAll('[data-jt]').forEach(c=>{if(!c.disabled)c.onchange=()=>toggleJobTitleLocation(locationId,c.dataset.jt,c.checked)});box.querySelectorAll('[data-deljt]').forEach(b=>b.onclick=()=>deleteJobTitle(b.dataset.deljt,locationId))}
async function deleteLocation(id){const l=data.locations.find(x=>String(x.id)===String(id));if(!l)return;const index=data.locations.findIndex(x=>String(x.id)===String(id))+1;if(!confirm(`Res želiš izbrisati Poslovalnico ${index}: ${l.name||'Brez imena'}?\n\nIzbrisane bodo tudi pripadajoče izmene. Tega dejanja ni mogoče razveljaviti.`))return;const msg=$('locMsg');try{if(msg){msg.className='msg';msg.textContent='Brisanje poslovalnice ...'}await api('/rest/v1/location_shifts?location_id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await api('/rest/v1/job_title_locations?location_id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await api('/rest/v1/locations?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await loadAll();locations();const ok=$('locMsg');if(ok){ok.className='msg ok';ok.textContent='Poslovalnica je izbrisana. Številčenje je osveženo.'}}catch(e){if(msg){msg.className='msg error';msg.textContent='Brisanje ni uspelo: '+e.message+' Poslovalnica je morda še dodeljena uporabniku.'}}}
async function saveCompany(){try{let theme=document.querySelector('[data-theme].active')?.dataset.theme||'GREEN',body={company_name:$('cName').value,company_address:$('cAddress').value,admin_mode:$('cMode').value,default_language:$('cLang').value,power_theme_code:theme,updated_at:new Date().toISOString()},f=$('logoFile').files[0];if(f){let n='company-logo-'+Date.now()+'.'+f.name.split('.').pop(),r=await fetch(BASE+'/storage/v1/object/company-assets/'+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':f.type},body:f});if(!r.ok)throw Error(await r.text());body.logo_url=BASE+'/storage/v1/object/public/company-assets/'+n}await api('/rest/v1/company_settings?id=eq.'+data.settings.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});await loadAll();$('setMsg').className='msg ok';$('setMsg').textContent='Shranjeno.';settings()}catch(e){$('setMsg').className='msg error';$('setMsg').textContent=e.message}}
function editLocation(id){const editingId=String(id||'').trim();let l=data.locations.find(x=>String(x.id)===editingId)||{},isNew=editingId==='',ls=data.shifts.filter(x=>String(x.location_id)===editingId);openDrawer(isNew?'Nova poslovalnica':'Uredi poslovalnico',`<div class="formgrid"><div class="field"><label>Ime</label><input id="lName" value="${esc(l.name||'')}"></div><div class="field"><label>Naslov</label><input id="lAddress" value="${esc(l.address||'')}"></div><div class="field"><label>Poštna št.</label><input id="lPost" value="${esc(l.postal_code||'')}"></div><div class="field"><label>Kraj</label><input id="lCity" value="${esc(l.city||'')}"></div><div class="field"><label>GPS širina</label><input id="lLat" value="${l.latitude||''}"></div><div class="field"><label>GPS dolžina</label><input id="lLon" value="${l.longitude||''}"></div><div class="field"><label style="display:flex;align-items:center;gap:8px"><input id="lEnforceGps" type="checkbox" ${l.enforce_location===false?'':'checked'} style="width:18px;height:18px"> Upoštevaj GPS pri registraciji</label></div><div class="field"><label>Dovoljeni radij (m)</label><input id="lRadius" type="number" min="10" max="10000" step="10" value="${l.allowed_radius_m??200}"></div><div class="field"><label>Prazniki</label><select id="lHoliday"><option>CLOSED</option><option>NORMAL</option><option>SUNDAY</option><option>SPECIAL</option></select></div></div><div class="toolbar"><button id="gpsNow" class="btn secondary">Uporabi trenutni GPS</button><button id="mapAddress" class="btn secondary">Poišči naslov na Google Maps</button></div><div class="section">Delovna mesta poslovalnice</div><div class="muted" style="margin-bottom:8px">Označi delovna mesta, ki so dovoljena v tej poslovalnici. Globalna delovna mesta veljajo povsod.</div><div id="jobTitleBox" class="panel" style="padding:10px;margin:0 0 10px"></div><div class="toolbar"><div class="field" style="min-width:230px"><label>Novo delovno mesto</label><input id="newJobTitleName" placeholder="npr. Vodja izmene"></div><button type="button" id="addJobTitleBtn" class="btn secondary">＋ Dodaj delovno mesto</button></div><div id="jobTitleMsg"></div><div class="section">Izmene</div><div id="locShiftBox">${Array.from({length:3},(_,j)=>{let i=j+1,x=ls.find(y=>y.shift_no===i)||{};return `<div class="shift-card"><label><input id="ls${i}on" type="checkbox" ${x.active||x.id?'checked':''}> Izmena ${i}</label><div class="shiftrow"><span></span><input id="ls${i}a" type="time" value="${String(x.start_time||['06:00','14:00','22:00'][j]).slice(0,5)}"><input id="ls${i}b" type="time" value="${String(x.end_time||['14:00','22:00','06:00'][j]).slice(0,5)}"><input id="ls${i}m" type="number" value="${x.daily_work_minutes||480}"></div></div>`}).join('')}</div><button id="saveLoc" class="btn">Shrani poslovalnico</button><div id="lMsg"></div>`);$('lHoliday').value=l.holiday_mode||'CLOSED';const syncGpsRadius=()=>{const on=$('lEnforceGps').checked;$('lRadius').disabled=!on;$('lRadius').style.opacity=on?'1':'.45';$('lRadius').style.background=on?'':'#eef1f0'};$('lEnforceGps').onchange=syncGpsRadius;syncGpsRadius();renderJobTitlePicker(editingId);$('addJobTitleBtn').onclick=()=>{if(!editingId){$('jobTitleMsg').className='msg error';$('jobTitleMsg').textContent='Najprej shrani novo poslovalnico, nato jo odpri z Uredi in dodaj delovna mesta.';return}addJobTitleForLocation(editingId)};$('gpsNow').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{$('lLat').value=p.coords.latitude.toFixed(7);$('lLon').value=p.coords.longitude.toFixed(7)},e=>alert(e.message),{enableHighAccuracy:true});$('mapAddress').onclick=()=>window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([$('lAddress').value,$('lPost').value,$('lCity').value].filter(Boolean).join(', ')),'_blank');$('saveLoc').onclick=async()=>{try{let body={name:$('lName').value,address:$('lAddress').value,postal_code:$('lPost').value,city:$('lCity').value,country:'Slovenija',country_code:'SI',latitude:$('lLat').value||null,longitude:$('lLon').value||null,holiday_mode:$('lHoliday').value,enforce_location:$('lEnforceGps').checked,allowed_radius_m:Math.max(10,Math.min(10000,+$('lRadius').value||200)),active:true,updated_at:new Date().toISOString()},lid=editingId;if(isNew){let r=await api('/rest/v1/locations',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});lid=r[0].id}else await api('/rest/v1/locations?id=eq.'+encodeURIComponent(editingId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});for(let i=1;i<=3;i++){if(!$('ls'+i+'on').checked)continue;let sb={location_id:lid,shift_no:i,shift_name:'Izmena '+i,start_time:$('ls'+i+'a').value,end_time:$('ls'+i+'b').value,daily_work_minutes:+$('ls'+i+'m').value||480,early_arrival_minutes:30,late_departure_minutes:60,active:true};await api('/rest/v1/location_shifts?on_conflict=location_id,shift_no',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(sb)})}await loadAll();$('lMsg').className='msg ok';$('lMsg').textContent=isNew?'Poslovalnica je dodana.':'Spremembe poslovalnice so shranjene.';$('drawer').classList.add('hidden');locations()}catch(e){$('lMsg').className='msg error';$('lMsg').textContent=e.message}}}
function openDrawer(title,body){$('drawerTitle').textContent=title;$('drawerBody').innerHTML=body;$('drawer').classList.remove('hidden')}
$('closeDrawer').onclick=()=>$('drawer').classList.add('hidden');$('rememberMe').checked=localStorage.getItem('maco_remember')!=='0';$('rememberMe').onchange=()=>localStorage.setItem('maco_remember',$('rememberMe').checked?'1':'0');$('loginForm').onsubmit=login;const logoutBtn=$('logout');if(logoutBtn)logoutBtn.onclick=()=>{localStorage.removeItem('maco_power_session');sessionStorage.removeItem('maco_power_session');location.reload()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));restore();
</script></body></html>
